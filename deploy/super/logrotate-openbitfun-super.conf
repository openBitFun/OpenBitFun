# Install as /etc/logrotate.d/openbitfun-super (deploy/super/README.md).
#
# Retention of the OpenBitFun 2.0 site's nginx logs (super.openbitfun.com).
# They live in their own directory, so the host's 60-day policy for
# /var/log/nginx/*.log (kept for 1.x release-mirror download accounting)
# never matches them and the two stanzas never overlap.
#
# 14 days: the lines carry only route, status, size and timing (no client
# address, query string or ids), which is what incident debugging needs;
# two weeks covers a weekly release plus a week of reports. maxsize bounds a
# burst day; anything older has no use and is not kept.
/var/log/nginx/openbitfun-super/*.log {
	daily
	maxsize 100M
	rotate 14
	maxage 14
	missingok
	notifempty
	compress
	delaycompress
	create 0640 www-data adm
	sharedscripts
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
