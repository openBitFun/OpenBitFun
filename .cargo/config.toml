# ts-rs (Rust -> TypeScript) export configuration.
# `cargo test --features ts` emits `.ts` bindings into the directory below. The
# React desktop UI that consumed them was retired, and no remaining frontend
# imports them, so they go to an ignored scratch location under `target/`
# (never into a source tree). Point a real consumer here if one is added.
[env]
TS_RS_EXPORT_DIR = { value = "target/ts-rs-bindings", relative = true }
# Map i64/u64 to `number` (not `bigint`) so generated types use the frontend
# convention (timestamps are `number` ms).
TS_RS_LARGE_INT = "number"
