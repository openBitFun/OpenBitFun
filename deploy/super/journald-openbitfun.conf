# Install as /etc/systemd/journald.conf.d/50-openbitfun.conf, then
# `systemctl restart systemd-journald` (deploy/super/README.md).
#
# Caps the host journal, which holds the OpenBitFun 2.0 units' logs. Without
# this the default is 10 % of the file system (up to 4 GiB) and no age limit.
# Thirty days covers the services' debugging needs; nothing older is kept.
[Journal]
SystemMaxUse=2G
SystemKeepFree=10G
MaxRetentionSec=30day
MaxFileSec=1week
