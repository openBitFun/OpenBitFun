<body>
<div class=&quot;page&quot; id=&quot;root&quot; data-openbitfun-design-system-root data-color-scheme=&quot;light&quot;><div class=&quot;wrap&quot;>
  <h1>毕方 · 自己搭配</h1>
  <p class=&quot;lead&quot;>选颜色和五官，实时预览。</p>

  <div class=&quot;layout&quot;>
    <section class=&quot;panel&quot; aria-label=&quot;选择颜色&quot;>
      <div class=&quot;group&quot;>
        <h2>身体</h2>
        <div class=&quot;swatches&quot;><div id=&quot;bodies&quot; style=&quot;display:contents&quot;></div><label class=&quot;pick&quot; id=&quot;bodyPickWrap&quot; title=&quot;自定义身体颜色&quot;><input type=&quot;color&quot; id=&quot;bodyPick&quot; aria-label=&quot;自定义身体颜色&quot;></label></div>

        <div class=&quot;hexrow&quot;>HEX <input class=&quot;hex&quot; id=&quot;ballHex&quot; spellcheck=&quot;false&quot; maxlength=&quot;7&quot; aria-label=&quot;天线球颜色 HEX&quot;></div>
      </div>
      <div class=&quot;group&quot;>

          <fieldset><legend>质感</legend><div class=&quot;opts-row&quot;><label><input type=&quot;radio&quot; name=&quot;finish&quot; value=&quot;smooth&quot; checked>光滑</label><label><input type=&quot;radio&quot; name=&quot;finish&quot; value=&quot;metal&quot;>金属</label><label><input type=&quot;radio&quot; name=&quot;finish&quot; value=&quot;plush&quot;>毛绒</label></div></fieldset>
          <fieldset><legend>背景</legend><div class=&quot;opts-row&quot;><label><input type=&quot;radio&quot; name=&quot;bg&quot; value=&quot;tertiary&quot; checked title=&quot;surface.tertiary&quot;>浅灰</label><label><input type=&quot;radio&quot; name=&quot;bg&quot; value=&quot;scene&quot;>场景</label><label><input type=&quot;radio&quot; name=&quot;bg&quot; value=&quot;chrome&quot;>窗口</label></div></fieldset>

          <fieldset><legend>腮红</legend><div class=&quot;opts-row&quot;><label><input type=&quot;radio&quot; name=&quot;blush&quot; value=&quot;auto&quot; checked>默认</label><label><input type=&quot;radio&quot; name=&quot;blush&quot; value=&quot;none&quot;>无</label><label><input type=&quot;radio&quot; name=&quot;blush&quot; value=&quot;coral&quot;><i class=&quot;bl&quot; style=&quot;background:#ef8d70&quot;></i>珊瑚</label><label><input type=&quot;radio&quot; name=&quot;blush&quot; value=&quot;pink&quot;><i class=&quot;bl&quot; style=&quot;background:#ff8fab&quot;></i>粉</label><label><input type=&quot;radio&quot; name=&quot;blush&quot; value=&quot;peach&quot;><i class=&quot;bl&quot; style=&quot;background:#ffb07c&quot;></i>蜜桃</label><label><input type=&quot;radio&quot; name=&quot;blush&quot; value=&quot;rose&quot;><i class=&quot;bl&quot; style=&quot;background:#e8738f&quot;></i>玫瑰</label></div></fieldset>

</div></div>

<script>
/* 毕方 BitFun · 多状态形象生成器 v1.0
 * 形象来源：等距视角的圆角方块 + 顶面中心白色短天线 + 球；右侧面两只白色竖椭圆小眼（参考 飞书20261116 视频）。
 * 语义：天线球 = 状态灯（颜色区分大类），眼睛 = 注意力/情绪，道具 = 具体任务（仅大尺寸），胶囊 = 精确进度。
 * 选项：finish = smooth（光滑，视频原版）| metal（金属）| plush（毛绒：长绒玩具质感）；palette = PALETTES 中的配色。
 */
(function (root) {
  const C = { line: '#E3E5EA', sub: '#C9CED6', ink: '#2A2D35' };
  // 道具里的内容线条用当前状态色的浅调，随配色和状态变化
  const mixHex = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, '0')).join('');
  const tint = (h, k = .62) => /^#[0-9a-f]{6}$/i.test(h) ? '#' + [1, 3, 5].map(i => Math.round(parseInt(h.substr(i, 2), 16) * (1 - k) + 255 * k).toString(16).padStart(2, '0')).join('') : h;

  const BASE = {
    ink: { hex: '#171717', name: '墨 · 正文' }, muted: { hex: '#706F6A', name: '暖灰 · 次要文字' }, subtle: { hex: '#A5A39B', name: '浅暖灰 · 辅助' },
    line: { hex: '#E9E7E2', name: '分隔线' }, soft: { hex: '#F4F3F0', name: '浅底' }, sidebar: { hex: '#F8F8F9', name: '侧栏底' }, page: { hex: '#FFFFFF', name: '页面底' }
  };
  /* ---------- 统一色板：身体色 + 天线球色（“自己搭配”和全部页面共用这一份） ----------
     tok 为 OpenBitFun 设计系统 token，hex 为它在浅色主题下的取值（页面里会按主题替换）。 */
  const BOARD = {
    bodies: [
      { key: 'white',    name: '纯白',     hex: '#F7F7F7', ball: '#2FCFD8' },
      { key: 'gray',     name: '中灰',     hex: '#7B7B7B', ball: '#F4F3EE' },
      { key: 'black',    name: '终端黑',   hex: '#0B0B0B', ball: '#2FCFD8', note: '视频原版' },
      { key: 'red',      name: '红',       hex: '#C95765', tok: 'color.identity.project.red' },
      { key: 'tomato',   name: '番茄',     hex: '#FF4A2E' },
      { key: 'orange',   name: '橙',       hex: '#D47628', tok: 'color.identity.project.orange' },
      { key: 'yellow',   name: '黄',       hex: '#D5A910', tok: 'color.identity.project.yellow' },
      { key: 'lime',     name: '荧光柠',   hex: '#D9F23F', ball: '#2E323A' },
      { key: 'green',    name: '绿',       hex: '#269F70', tok: 'color.identity.project.green' },
      { key: 'phthalo',  name: '酞菁绿',   hex: '#123E34' },
      { key: 'cyan',     name: '青',       hex: '#07879A', tok: 'color.identity.project.cyan' },
      { key: 'blue',     name: '蓝',       hex: '#2563EB', tok: 'color.identity.project.blue' },
      { key: 'midnight', name: '午夜',     hex: '#17213A' },
      { key: 'lavender', name: '数字薰衣草', hex: '#DCD2F7', ball: '#2FCFD8' },
      { key: 'purple',   name: '紫',       hex: '#7B43F8', tok: 'color.identity.project.purple' },
      { key: 'pink',     name: '粉',       hex: '#DB2777', tok: 'color.identity.project.pink' },
      { key: 'hotpink',  name: '热粉',     hex: '#FF4FA7' },
      { key: 'bifang',   name: '毕方',     hex: '#2E8C86', note: '《山海经》特别版 · 青质赤文白喙', bifang: true }
    ],
    balls: [
      { key: 'highlight', name: '设计系统高亮', hex: '#059CB0', tok: 'color.control.highlight.background' },
      { key: 'cyan',  name: '青',   hex: '#2FCFD8' }, { key: 'lime', name: '青柠', hex: '#9AD94A' }, { key: 'berry', name: '莓果', hex: '#E66FE0' },
      { key: 'graphite', name: '石墨', hex: '#2E323A' }, { key: 'pearl', name: '珍珠白', hex: '#F4F3EE' }, { key: 'same', name: '和身体同色（浅一档）', same: true }
    ]
  };
  // 感知亮度（OKLab L）：L < 0.70 的身体用白眼睛，否则黑眼睛
  const okL = h => { const f = i => { const v = parseInt(h.substr(i, 2), 16) / 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
    const [r, g, b] = [f(1), f(3), f(5)]; return .2104542553 * Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b) + .793617785 * Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b) - .0040720468 * Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b); };
  const hsl = h => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255), M = Math.max(r, g, b), m = Math.min(r, g, b), l = (M + m) / 2, d = M - m;
    if (!d) return [0, 0, l * 100]; const s2 = d / (1 - Math.abs(2 * l - 1)), hh = M === r ? ((g - b) / d) % 6 : M === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(hh * 60 + 360) % 360, s2 * 100, l * 100]; };
  const fromHsl = (h, s2, l) => { s2 = Math.max(0, Math.min(100, s2)) / 100; l = Math.max(0, Math.min(100, l)) / 100; const k = n => (n + h / 30) % 12, a = s2 * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); };
  const adjust = (hex, dl, ds = 0) => { const [h, s2, l] = hsl(hex); return fromHsl(h, s2 < 4 ? s2 : s2 + ds, l + dl); };
  // 由身体色 + 球色得到整套配色（“自己搭配”页也用它，只是另外传入主题相关的值）
  function makePalette(body, ball, o = {}) {
    const chroma = (() => { const v = [1, 3, 5].map(i => parseInt(body.substr(i, 2), 16) / 255); return Math.max(...v) - Math.min(...v); })();
    const L = hsl(body)[2], dark = L < 40, solid = !dark &amp;&amp; chroma > .35;
    const W = o.onDark || '#ffffff', K = o.onLight || '#000000';
    const eye = o.eye === 'white' ? W : o.eye === 'black' ? K : (okL(body) < .70 ? W : K);
    if (ball === 'same') ball = L < 20 ? adjust(body, 22) : adjust(body, 12, 4);
    return { name: o.name || '自定义', note: o.note || '', side: body, sideL: adjust(body, dark ? -2 : -5, dark ? 0 : 6), top0: adjust(body, 3), top1: dark ? adjust(body, 16) : adjust(body, 9, -10),
      eye, stem: dark ? '#e9ecf0' : adjust(body, -22, 4), accent: ball, hand: adjust(body, -3), blush: body, seam: body,
      fur: '#ffffff', furOp: .18, rim: dark ? .25 : solid ? .45 : .9, shade: dark ? 1 : solid ? .7 : .3,
      ring: solid || dark ? (o.ring || '#ffffff') : null, status: o.status, bifang: !!o.bifang };
  }
  const PALETTES = Object.fromEntries(BOARD.bodies.map(b => [b.key, makePalette(b.hex, b.ball || '#F4F3EE', { name: b.name, note: b.note || (b.tok ? '设计系统身份色' : ''), bifang: b.bifang })]));


  const CAT = {
    idle:  { key: 'idle',  name: '待命',     color: '#2BBFD8', hue: '随配色', mean: '品牌主色，随配色变化，但必须避开下面 5 个状态色相' },
    think: { key: 'think', name: '感知·思考', color: '#9C7CFF', deep: '#6E45F0', hue: '紫 ≈255°', mean: '在听、在想、在规划——还没动手' },
    work:  { key: 'work',  name: '执行',     color: '#5B8CFF', deep: '#2F62E8', hue: '蓝 ≈222°', mean: '正在改文件、跑命令、读资料' },
    ask:   { key: 'ask',   name: '需要你',   color: '#FFB547', deep: '#E08A00', hue: '琥珀 ≈36°', mean: '唯一需要用户行动的颜色' },
    ok:    { key: 'ok',    name: '完成',     color: '#3CCB7F', deep: '#139B55', hue: '绿 ≈148°', mean: '与产品成功色同一色相，略提亮' },
    err:   { key: 'err',   name: '异常',     color: '#FF6B6B', deep: '#E5293F', hue: '红 ≈0°', mean: '失败且需要处理' },
    off:   { key: 'off',   name: '离线',     color: '#B9B7B0', deep: '#8F8D86', hue: '暖灰', mean: '与产品文字暖灰同源，不抢眼' }
  };

  // 等距方块几何（viewBox 0..120）
  const SIL = 'M60 38 L87 53.6 L87 77.6 L60 93.2 L33 77.6 L33 53.6Z';
  const TOP = 'M60 38 L87 53.6 L60 69.2 L33 53.6Z';
  const LEFT = 'M33 53.6 L60 69.2 L60 93.2 L33 77.6Z';
  const FACE = 'matrix(1 -0.577 0 1 60 69.2)'; // 3D：右侧面局部坐标系
  const FLATFACE = 'matrix(1.35 0 0 1.35 37.05 56.8)'; // 平面：正面居中
  const TINYFACE = 'matrix(1.6 0 0 1.6 32.8 51)'; // 图标：眼睛更大
  const face = x => x.tiny ? TINYFACE : x.flat ? FLATFACE : FACE;

  const STYLE = `
.bf [class]{transform-box:fill-box}
.bf .f{animation:bf-f 3.2s ease-in-out infinite}
@keyframes bf-f{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bf .f-slow{animation:bf-f 4.8s ease-in-out infinite}
.bf .idle{animation:bf-jelly 4.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bf-jelly{0%,34%,100%{transform:translateY(0) rotate(0) scale(1,1)}40%{transform:translateY(0) rotate(0) scale(1.035,.955)}49%{transform:translateY(-2px) rotate(-4.5deg) scale(.985,1.02)}59%{transform:translateY(0) rotate(3.5deg) scale(1,1)}68%{transform:rotate(-1.8deg)}77%{transform:rotate(.6deg)}81%{transform:rotate(0)}}
.bf .ant-idle{animation:bf-antj 4.4s ease-in-out infinite;transform-origin:50% 100%}

    if (!x.front) {

<path d=&quot;M60 71.4 L60 92&quot; fill=&quot;none&quot; stroke=&quot;#fff&quot; stroke-opacity=&quot;.5&quot; stroke-width=&quot;1&quot; filter=&quot;url(#hb${u})&quot;/>`;
    if (plush) g += `<path d=&quot;${SIL}&quot; fill=&quot;#000&quot; stroke=&quot;#000&quot; stroke-width=&quot;${sw}&quot; stroke-linejoin=&quot;round&quot; filter=&quot;url(#fur${u})&quot; opacity=&quot;${P.furOp}&quot;/>

<rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;120&quot; height=&quot;100&quot; fill=&quot;url(#ao${u})&quot; mask=&quot;url(#m${u})&quot; opacity=&quot;.35&quot;/>
<clipPath id=&quot;cl${u}&quot;><path d=&quot;${SIL}&quot; stroke=&quot;#000&quot; stroke-width=&quot;${sw - 2}&quot; stroke-linejoin=&quot;round&quot;/></clipPath>${down(x)}<g transform=&quot;${FACE}&quot; fill=&quot;#000&quot; opacity=&quot;.1&quot; filter=&quot;url(#hb${u})&quot;><ellipse cx=&quot;9.5&quot; cy=&quot;13&quot; rx=&quot;4.4&quot; ry=&quot;6.8&quot;/><ellipse cx=&quot;24.5&quot; cy=&quot;13&quot; rx=&quot;4.4&quot; ry=&quot;6.8&quot;/></g>`;  // 眼窝：眼睛周围压暗一圈，像嵌进毛里

  function eyes(x, type, o = {}) {
    const { P } = x, ec = P.eye;
    const dx = o.dx || 0, dy = o.dy || 0, cls = o.cls ? ` class=&quot;${o.cls}&quot;` : '';
    const E = [[9.5, 12], [24.5, 12]];
    const st = w => `fill=&quot;none&quot; stroke=&quot;${ec}&quot; stroke-width=&quot;${w}&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;`;
    const shine = (ex, ey) => P.shine ? `<circle cx=&quot;${ex - .8}&quot; cy=&quot;${ey - 2.3}&quot; r=&quot;.85&quot; fill=&quot;#fff&quot; opacity=&quot;.9&quot;/>` : '';
    let s = '';
    switch (type) {
      case 'wide': s = E.map(([a, b]) => `<g class=&quot;blink&quot;><ellipse cx=&quot;${a}&quot; cy=&quot;${b}&quot; rx=&quot;3.5&quot; ry=&quot;6.2&quot; fill=&quot;${ec}&quot;/>${shine(a, b)}</g>`).join(''); break;
      case 'focus': s = E.map(([a, b]) => `<path d=&quot;M${a - 3} ${b - 1.6} H${a + 3} A3 5.2 0 0 1 ${a - 3} ${b - 1.6}Z&quot; fill=&quot;${ec}&quot;/>`).join(''); break;
      case 'squint': s = E.map(([a, b]) => `<path d=&quot;M${a - 3.1} ${b - .4} H${a + 3.1} A3.1 2.9 0 0 1 ${a - 3.1} ${b - .4}Z&quot; fill=&quot;${ec}&quot;/>`).join(''); break;
      // 完成：眼睛略微睁大，右上角闪一颗小星芒（眼睛本身保持干净，不挖洞、不变形）
      case 'happy': s = E.map(([a, b]) => `<ellipse cx=&quot;${a}&quot; cy=&quot;${b - .3}&quot; rx=&quot;3.5&quot; ry=&quot;6.2&quot; fill=&quot;${ec}&quot;/>`).join('') + `<path d=&quot;M29.6 3.2 Q30 5.4 32.2 5.8 Q30 6.2 29.6 8.4 Q29.2 6.2 27 5.8 Q29.2 5.4 29.6 3.2Z&quot; fill=&quot;${ec}&quot; class=&quot;spark&quot;/>`; break;
      // 完成 · 备选：实心弯月笑眼
      case 'happyCrescent': s = E.map(([a, b]) => `<path d=&quot;M${a - 3.2} ${b + 1.8} Q${a} ${b - 5.6} ${a + 3.2} ${b + 1.8} Q${a} ${b - 1.4} ${a - 3.2} ${b + 1.8}Z&quot; fill=&quot;${ec}&quot; stroke=&quot;${ec}&quot; stroke-width=&quot;.6&quot; stroke-linejoin=&quot;round&quot;/>`).join(''); break;
      // 离线：眼睛收成低处的一条短胶囊，像合上的眼缝
      case 'closed': s = E.map(([a, b]) => `<rect x=&quot;${a - 2.8}&quot; y=&quot;${b + 1.4}&quot; width=&quot;5.6&quot; height=&quot;2&quot; rx=&quot;1&quot; fill=&quot;${ec}&quot;/>`).join(''); break;
      // 离线 · 备选：缩小的点状眼（像熄屏的指示灯）
      case 'closedDot': s = E.map(([a, b]) => `<circle cx=&quot;${a}&quot; cy=&quot;${b + 1.6}&quot; r=&quot;1.5&quot; fill=&quot;${ec}&quot; opacity=&quot;.7&quot;/>`).join(''); break;
      case 'xx': { const [[a, b], [c, d]] = E; s = `<path d=&quot;M${a - 1.8} ${b - 2.6} L${a + 1.8} ${b} L${a - 1.8} ${b + 2.6}&quot; ${st(2.5)}/><path d=&quot;M${c + 1.8} ${d - 2.6} L${c - 1.8} ${d} L${c + 1.8} ${d + 2.6}&quot; ${st(2.5)}/>`; break; }
      default: s = E.map(([a, b]) => `<g class=&quot;blink&quot;><ellipse cx=&quot;${a}&quot; cy=&quot;${b}&quot; rx=&quot;2.9&quot; ry=&quot;5.3&quot; fill=&quot;${ec}&quot;/>${shine(a, b)}</g>`).join('');
    }
    return `<g transform=&quot;${face(x)}&quot;${x.plush ? ` filter=&quot;url(#ev${x.u})&quot;` : ''}><g transform=&quot;translate(${dx} ${dy})&quot;><g${cls}>${s}</g></g></g>`;  // 毛绒：眼睛做成有体积的小珠子
  }

  const blush = (x, op = .75) => !x.cute || x.P.bifang || x.blushPick !== undefined ? '' : `<g transform=&quot;${face(x)}&quot; fill=&quot;${x.P.blush}&quot; opacity=&quot;${op}&quot;><ellipse cx=&quot;4&quot; cy=&quot;20.2&quot; rx=&quot;3&quot; ry=&quot;1.7&quot;/><ellipse cx=&quot;30&quot; cy=&quot;20.2&quot; rx=&quot;3&quot; ry=&quot;1.7&quot;/></g>`;
  const soft = x => blush(x, x.P.softOp || .45);
  // 鸟嘴（白喙）：毕方默认带；其他颜色在“自己搭配”里选“鸟嘴”也可以加。浅色身体上白喙看不见，改用暖黄色
  function beakOf(x) {

  function mouth(x, type, fixed) {
    if (x.mouthPick &amp;&amp; !fixed) { if (x.mouthPick !== 'state') return ''; } else if (!x.cute &amp;&amp; !fixed) return '';
    const ec = x.P.eye, st = `fill=&quot;none&quot; stroke=&quot;${ec}&quot; stroke-width=&quot;1.35&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;`;

  function antenna(x, color, fx = [], cls = 'ant') {
    const { P, u, plush } = x;
    if (x.tiny) fx = [];
    let under = '', over = '', ballCls = '';
    if (P.ring) under += x.tiny ? `<circle cx=&quot;60&quot; cy=&quot;27&quot; r=&quot;14.2&quot; fill=&quot;${P.ring}&quot;/>` : x.flat ? `<circle cx=&quot;60&quot; cy=&quot;28&quot; r=&quot;11.2&quot; fill=&quot;${P.ring}&quot;/>` : `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;13&quot; fill=&quot;${P.ring}&quot;/>`;

    if (fx.includes('flash')) ballCls = ' class=&quot;flash&quot;';

    if (fx.includes('spin')) over += `<g class=&quot;spin&quot;><circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;15&quot; fill=&quot;none&quot;/><path d=&quot;M60 14 A15 15 0 0 1 75 29&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot;/></g>`;
    if (fx.includes('orbit')) over += `<g><circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;17&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-opacity=&quot;.28&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;1.5 3&quot;/><circle cx=&quot;77&quot; cy=&quot;29&quot; r=&quot;2.6&quot; fill=&quot;${color}&quot;><animateTransform attributeName=&quot;transform&quot; type=&quot;rotate&quot; from=&quot;0 60 29&quot; to=&quot;360 60 29&quot; dur=&quot;1.8s&quot; repeatCount=&quot;indefinite&quot;/></circle></g>`;

    const be = edgeOf(color), bs = be ? ` stroke=&quot;${be}&quot; stroke-width=&quot;${x.tiny ? 2 : 1.1}&quot;` : '';
    const ball = x.tiny ? `<circle cx=&quot;60&quot; cy=&quot;27&quot; r=&quot;12.5&quot; fill=&quot;${color}&quot;${bs}/>` : x.flat ? `<circle cx=&quot;60&quot; cy=&quot;28&quot; r=&quot;9.6&quot; fill=&quot;${color}&quot;${bs}/>${x.front ? `<circle cx=&quot;60&quot; cy=&quot;28&quot; r=&quot;9.6&quot; fill=&quot;url(#bm${u})&quot;/>` : ''}` : `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;${color}&quot;${bs}/>${plush ? `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;url(#bm${u})&quot;/>` : `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;url(#bs${u})&quot;/>`}${plush ? '' : `<ellipse cx=&quot;55.6&quot; cy=&quot;23.8&quot; rx=&quot;4&quot; ry=&quot;2.6&quot; transform=&quot;rotate(-30 55.6 23.8)&quot; fill=&quot;#fff&quot; opacity=&quot;.6&quot; filter=&quot;url(#hb${u})&quot;/><circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.1&quot; fill=&quot;none&quot; stroke=&quot;#000&quot; stroke-opacity=&quot;.1&quot; stroke-width=&quot;.8&quot;/>`}`;
    return `<g class=&quot;${cls}&quot;>
      ${x.front ? `<ellipse cx=&quot;60&quot; cy=&quot;49&quot; rx=&quot;4.4&quot; ry=&quot;1.8&quot; fill=&quot;#000&quot; opacity=&quot;.2&quot; filter=&quot;url(#hb${u})&quot;/><rect x=&quot;58.2&quot; y=&quot;35&quot; width=&quot;3.6&quot; height=&quot;14.5&quot; rx=&quot;1.8&quot; fill=&quot;url(#cr${u})&quot;/>` : x.flat ? `<rect x=&quot;58.3&quot; y=&quot;36&quot; width=&quot;3.4&quot; height=&quot;10.2&quot; fill=&quot;${edgeOf(P.side) || P.side}&quot;/>`
        : `${plush ? `<ellipse cx=&quot;60&quot; cy=&quot;54.4&quot; rx=&quot;5.2&quot; ry=&quot;2.4&quot; fill=&quot;#000&quot; opacity=&quot;.22&quot; filter=&quot;url(#hb${u})&quot;/><rect x=&quot;57.4&quot; y=&quot;30&quot; width=&quot;5.2&quot; height=&quot;24&quot; rx=&quot;2.6&quot; fill=&quot;url(#cr${u})&quot;/>` : `<rect x=&quot;57.4&quot; y=&quot;30&quot; width=&quot;5.2&quot; height=&quot;23.5&quot; rx=&quot;2.6&quot; fill=&quot;url(#cr${u})&quot;/><ellipse cx=&quot;60&quot; cy=&quot;53.8&quot; rx=&quot;7&quot; ry=&quot;3.6&quot; fill=&quot;url(#cc${u})&quot;/><ellipse cx=&quot;60&quot; cy=&quot;53.1&quot; rx=&quot;4&quot; ry=&quot;1.7&quot; fill=&quot;#fff&quot; opacity=&quot;.55&quot;/>`}`}
      <g transform=&quot;${x.flat ? '' : 'translate(0 -10) translate(60 29) scale(1.14) translate(-60 -29)'}&quot;>

  }

  const hand = (x, hx, hy, cls = '') => `<ellipse${cls ? ` class=&quot;${cls}&quot;` : ''} cx=&quot;${hx}&quot; cy=&quot;${hy}&quot; rx=&quot;4.8&quot; ry=&quot;3.8&quot; fill=&quot;${x.P.hand}&quot;${x.plush ? ` filter=&quot;url(#fz${x.u})&quot;` : ''}/>`;

  }

  /* ---------- 状态定义 ---------- */
  const STATES = [

  function parts(id, x, c, compact) {

  /* ---------- 颜色解析：待命=配色主色；同色系冲突时用加深版 ---------- */
  function hueOf(h) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255), M = Math.max(r, g, b), m = Math.min(r, g, b), d = M - m;

    const x = M === r ? ((g - b) / d) % 6 : M === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (x * 60 + 360) % 360;

  const chroma = h => { const v = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255); return Math.max(...v) - Math.min(...v); };
  const hueDist = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 360 - d); };
  // 身体与状态色相差 < 30° 时自动换成加深版
  function isDeep(cat, palette) {
    const P = typeof palette === 'object' ? palette : PALETTES[palette || 'obsidian'], hb = hueOf(P.side), hs = hueOf(CAT[cat].color);
    if (P.status) return false;
    return cat !== 'idle' &amp;&amp; cat !== 'off' &amp;&amp; hb != null &amp;&amp; hs != null &amp;&amp; chroma(P.side) >= .15 &amp;&amp; hueDist(hb, hs) < 30;
  }
  function statusColor(cat, palette) {
    const P = typeof palette === 'object' ? palette : PALETTES[palette || 'obsidian'];
    if (cat === 'idle') return P.accent;
    if (P.status &amp;&amp; P.status[cat]) return P.status[cat];
    return isDeep(cat, palette) ? CAT[cat].deep : CAT[cat].color;
  }

  /* ---------- 点缀：替代卡通道具的线框小标记（opt.accent） ---------- */
  // 线框图形本身，坐标范围约 ±10；bg=true 时线宽不随缩放变粗，用于大尺寸背景纹样
  function accentGlyph(id, c, bg = false) {
    const L = `fill=&quot;none&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${bg ? 1.3 : 1.6}&quot;${bg ? ' vector-effect=&quot;non-scaling-stroke&quot;' : ''} stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;`;
    const k = bg ? .5 : 1; // 背景版：实心点缩小，保持线稿感
    return {
      idle: `<circle r=&quot;7&quot; ${L} opacity=&quot;.35&quot;/><circle class=&quot;ac-breathe&quot; r=&quot;${3 * k}&quot; fill=&quot;${c}&quot;/>`,
      listening: [-6, -2, 2, 6].map((x, i) => `<line class=&quot;eq ${['', 'e2', 'e3', 'e2'][i]}&quot; x1=&quot;${x}&quot; y1=&quot;-7&quot; x2=&quot;${x}&quot; y2=&quot;7&quot; ${L}/>`).join(''),

      reasoning: `<g class=&quot;ac-spin&quot;><path d=&quot;M0 -8 A8 8 0 0 1 8 0&quot; ${L}/><path d=&quot;M0 8 A8 8 0 0 1 -8 0&quot; ${L}/></g><g class=&quot;ac-spin-r&quot;><path d=&quot;M4 0 A4 4 0 0 1 0 4&quot; ${L} opacity=&quot;.55&quot;/><path d=&quot;M-4 0 A4 4 0 0 1 0 -4&quot; ${L} opacity=&quot;.55&quot;/></g>`,
      planning: [-6, 0, 6].map((y, i) => `<path class=&quot;chk ${['', 'k2', 'k3'][i]}&quot; d=&quot;M-8 ${y} l1.6 1.6 l2.8 -3&quot; ${L}/><line x1=&quot;-1&quot; y1=&quot;${y}&quot; x2=&quot;${[8, 5, 7][i]}&quot; y2=&quot;${y}&quot; ${L} opacity=&quot;.45&quot;/>`).join(''),
      coding: `<path d=&quot;M-4 -6 L-9 0 L-4 6 M4 -6 L9 0 L4 6&quot; ${L}/><line class=&quot;caret&quot; x1=&quot;1.4&quot; y1=&quot;-6&quot; x2=&quot;-1.4&quot; y2=&quot;6&quot; ${L}/>`,
      searching: `<g class=&quot;sweep&quot;><circle cx=&quot;-2&quot; cy=&quot;-2&quot; r=&quot;5.2&quot; ${L}/><line x1=&quot;1.8&quot; y1=&quot;1.8&quot; x2=&quot;6&quot; y2=&quot;6&quot; ${L}/></g>`,
      running: bg ? `<line x1=&quot;-9&quot; y1=&quot;0&quot; x2=&quot;9&quot; y2=&quot;0&quot; ${L} opacity=&quot;.3&quot;/><line class=&quot;prog&quot; x1=&quot;-9&quot; y1=&quot;0&quot; x2=&quot;9&quot; y2=&quot;0&quot; ${L}/>` : `<rect x=&quot;-9&quot; y=&quot;-1.6&quot; width=&quot;18&quot; height=&quot;3.2&quot; rx=&quot;1.6&quot; fill=&quot;${c}&quot; opacity=&quot;.2&quot;/><rect class=&quot;prog&quot; x=&quot;-9&quot; y=&quot;-1.6&quot; width=&quot;18&quot; height=&quot;3.2&quot; rx=&quot;1.6&quot; fill=&quot;${c}&quot;/>`,
      debugging: `<circle r=&quot;6.5&quot; ${L}/><path d=&quot;M0 -9.5 V-5 M0 5 V9.5 M-9.5 0 H-5 M5 0 H9.5&quot; ${L}/><circle class=&quot;ac-breathe&quot; r=&quot;${1.8 * k}&quot; fill=&quot;${c}&quot;/>`,
      collab: `<path d=&quot;M-7 5 L0 -6 L7 5 Z&quot; ${L} opacity=&quot;.4&quot;/>${[[-7, 5], [0, -6], [7, 5]].map(([x, y]) => `<circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;${2.3 * k}&quot; fill=&quot;${c}&quot;/>`).join('')}<circle r=&quot;${1.4 * k}&quot; fill=&quot;${c}&quot;><animateMotion dur=&quot;2.4s&quot; repeatCount=&quot;indefinite&quot; path=&quot;M0 -6 L7 5 L-7 5 Z&quot;/></circle>`,
      awaiting: `<circle class=&quot;ac-ping&quot; r=&quot;9&quot; ${L}/><circle r=&quot;${3.2 * k}&quot; fill=&quot;${c}&quot;/>`,
      done: `<path class=&quot;ac-draw&quot; d=&quot;M-7 0 L-2 5 L8 -6&quot; ${L} stroke-width=&quot;2&quot;/>`,
      error: `<path d=&quot;M0 -8 L8.5 7 H-8.5 Z&quot; ${L}/><line x1=&quot;0&quot; y1=&quot;-2&quot; x2=&quot;0&quot; y2=&quot;2.4&quot; ${L}/><circle cx=&quot;0&quot; cy=&quot;4.8&quot; r=&quot;.9&quot; fill=&quot;${c}&quot;/>`,

    }[id];

    return `<g transform=&quot;translate(118 26)&quot;><circle r=&quot;14&quot; fill=&quot;${c}&quot; opacity=&quot;.08&quot;/>${accentGlyph(id, c)}</g>`;
  }

  /* ---------- 渲染 ---------- */
  function render(id, opt = {}) {
    const st = STATES.find(s => s.id === id);
    const P = typeof opt.palette === 'object' ? opt.palette : PALETTES[opt.palette || 'obsidian'];
    const x = { P, u: 'b' + (++UID), plush: opt.finish === 'plush', metal: opt.finish === 'metal', cute: opt.face === 'cute', lod: opt.lod || 1, flat: opt.view === 'flat' || !!opt.tiny, tiny: !!opt.tiny, mouthPick: opt.mouth, blushPick: opt.blush === 'none' ? null : opt.blush };
    if (opt.blush === 'none') x.blushPick = '';
    x.front = opt.view === 'front' &amp;&amp; x.plush; if (opt.view === 'front') x.flat = true; // 正面毛绒：平面的正面构图 + 毛绒
    if (x.flat &amp;&amp; !x.front) { x.plush = false; x.metal = false; } // 平面只有一种：纯平、简化
    const color = statusColor(st.cat, opt.palette);
    const compact = !!opt.compact || !!opt.tiny, ac = !!opt.accent &amp;&amp; !x.tiny;
    const list = parts(id, x, color, compact || ac).filter(Boolean).join('') + (x.plush &amp;&amp; x.furOver ? x.furOver : (x.tiny ? '' : bifangBlush(x))) + (x.mouthPick === 'beak' ? beakOf(x) : x.mouthPick &amp;&amp; x.mouthPick !== 'state' &amp;&amp; x.mouthPick !== 'none' &amp;&amp; !x.tiny ? mouth(x, x.mouthPick, true) : '');
    const wrap = st.wrap === 'hop' &amp;&amp; (compact || ac) ? 'f' : st.wrap;
    const vb = x.tiny ? '20 13 80 90' : ac ? '34 6 122 120' : compact ? '9 1 102 107' : '0 0 160 136';
    const shadow = x.flat &amp;&amp; !x.front ? '' : false ? `<ellipse cx=&quot;60&quot; cy=&quot;104&quot; rx=&quot;27&quot; ry=&quot;2.6&quot; fill=&quot;#000&quot; opacity=&quot;.07&quot;/>` : `<ellipse cx=&quot;60&quot; cy=&quot;103.5&quot; rx=&quot;30&quot; ry=&quot;4.2&quot; fill=&quot;url(#sh${x.u})&quot;/>`;
    const inner = compact &amp;&amp; !ac ? `${shadow}<g class=&quot;${wrap}&quot;>${list}</g>` : `<g transform=&quot;translate(20 12)&quot;>${shadow}<g class=&quot;${wrap}&quot;>${list}</g>${ac ? accent(id, color) : ''}</g>`;
    const style = opt.noStyle ? '' : `<style>${STYLE}</style>`;
    return `<svg class=&quot;bf&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;${vb}&quot; role=&quot;img&quot; aria-label=&quot;毕方 · ${st.name}&quot;>${style}${defs(x)}${inner}</svg>`;
  }

  root.BF = { STATES, CAT, BOARD, makePalette, PALETTES, BASE, STYLE, render, accentGlyph, statusColor, isDeep, hueOf, hueDist };
  if (typeof module !== 'undefined') module.exports = root.BF;
})(typeof window !== 'undefined' ? window : globalThis);

or.action.primary.background&quot;:{&quot;light&quot;:&quot;#101a27&quot;,&quot;dark&quot;:&quot;rgba(255, 255, 255, 0.16)&quot;},&quot;color.identity.project.blue&quot;:{&quot;light&quot;:&quot;#2563eb&quot;,&quot;dark&quot;:&quot;#60a5fa&quot;},&quot;color.identity.project.cyan&quot;:{&quot;light&quot;:&quot;#07879a&quot;,&quot;dark&quot;:&quot;#36c6d7&quot;},&quot;color.identity.project.green&quot;:{&quot;light&quot;:&quot;#269f70&quot;,&quot;dark&quot;:&quot;#34d399&quot;},&quot;color.identity.project.yellow&quot;:{&quot;light&quot;:&quot;#d5a910&quot;,&quot;dark&quot;:&quot;#ffcc00&quot;},&quot;color.identity.project.orange&quot;:{&quot;light&quot;:&quot;#d47628&quot;,&quot;dark&quot;:&quot;#ff8c00&quot;},&quot;color.identity.project.red&quot;:{&quot;light&quot;:&quot;#c95765&quot;,&quot;dark&quot;:&quot;#f36f80&quot;},&quot;color.identity.project.purple&quot;:{&quot;light&quot;:&quot;#7b43f8&quot;,&quot;dark&quot;:&quot;#8b5cf6&quot;},&quot;color.identity.project.pink&quot;:{&quot;light&quot;:&quot;#db2777&quot;,&quot;dark&quot;:&quot;#f472b6&quot;},&quot;color.status.info.emphasis&quot;:{&quot;light&quot;:&quot;#2e7eff&quot;,&quot;dark&quot;:&quot;#2e7eff&quot;},&quot;color.status.success.emphasis&quot;:{&quot;light&quot;:&quot;#1aa73e&quot;,&quot;dark&quot;:&quot;#1aa73e&quot;},&quot;color.status.warning.emphasis&quot;:{&quot;light&quot;:&quot;#ff8c00&quot;,&quot;dark&quot;:&quot;#ff8c00&quot;},&quot;color.status.danger.emphasis&quot;:{&quot;light&quot;:&quot;#ec221f&quot;,&quot;dark&quot;:&quot;#ec221f&quot;},&quot;color.field.background&quot;:{&quot;light&quot;:&quot;#ffffff&quot;,&quot;dark&quot;:&quot;#1c1c1f&quot;},&quot;color.field.border&quot;:{&quot;light&quot;:&quot;rgba(0, 0, 0, 0.08)&quot;,&quot;dark&quot;:&quot;rgba(255, 255, 255, 0.18)&quot;},&quot;color.field.borderFocus&quot;:{&quot;light&quot;:&quot;#858585&quot;,&quot;dark&quot;:&quot;#858585&quot;}};

  /* ---- 颜色工具 ---- */
  const toHsl = h => { const [r,g,b] = [1,3,5].map(i => parseInt(h.substr(i,2),16)/255); const M=Math.max(r,g,b), m=Math.min(r,g,b), l=(M+m)/2, d=M-m;

  const norm = h => h.toLowerCase();
  // 感知亮度（OKLab L）：深色身体用白眼睛，浅色身体用黑眼睛
  const okL = h => { const f = i => { const v = parseInt(h.substr(i,2),16)/255; return v<=.04045 ? v/12.92 : ((v+.055)/1.055)**2.4; };
    const [r,g,b] = [f(1),f(3),f(5)], l = Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b), m = Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b), s = Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
    return .2104542553*l + .793617785*m - .0040720468*s; };
  const EYE_SPLIT = .70;

  /* ---- 可选颜色：主推方案 R 的身体色 + 常用球色 ---- */
  const S = { mouth:'auto', blush:'auto', eye:'auto', finish:'smooth', bg:'tertiary', scheme:'light', body:{tok:'color.identity.project.cyan'}, ball:{tok:'color.control.highlight.background'} };
  const t = n => TK[n][S.scheme];
  // 统一色板：身体色和天线球色都来自生成器里的 BF.BOARD，全文件共用这一份
  const BODIES = BF.BOARD.bodies.map(b => Object.assign({}, b));
  const BALLS = BF.BOARD.balls.map(b => Object.assign({}, b));
  const hexOf = o => o.tok ? t(o.tok) : o.hex;
  const bodyHex = () => hexOf(S.body);
  const ballHex = () => S.ball.same ? (toHsl(bodyHex())[2] < 20 ? adj(bodyHex(), 22) : adj(bodyHex(), 12, 4)) : hexOf(S.ball);

  /* ---- 由身体色 + 球色得到整套配色 ---- */
  function palette(){
    const b = S.body;
    return BF.makePalette(bodyHex(), ballHex(), { eye: S.eye, bifang: b.bifang, name: b.name, onDark: t('color.content.onDark'), onLight: t('color.content.onLight'), ring: t('color.surface.raised'),
      status: { think: t('color.accent.secondary'), work: t('color.status.info.emphasis'), ask: t('color.status.warning.emphasis'),
        ok: t('color.status.success.emphasis'), err: t('color.status.danger.emphasis'), off: t('color.content.muted') } });
  }

  /* ---- 检查 ---- */
  const STATUS_NAMES = { think:'思考', work:'执行', ask:'需要你', ok:'完成', err:'异常' };
  function checks(P){
    const out = [], stage = t('color.surface.' + S.bg);
    const eyeC = contrast(P.side, P.eye);
    out.push([eyeC >= 3 ? 'ok' : 'warn', `眼睛对比度 ${eyeC.toFixed(1)}:1`, eyeC >= 3 ? '' : '低于 3:1，眼睛看不清，建议换身体颜色。']);

    const edged = lum(P.side) > .72; // 生成器会给浅色身体自动加细轮廓

    const hb = hueOf(P.accent);
    const clash = hb == null ? [] : Object.entries(P.status).filter(([k]) => STATUS_NAMES[k]).map(([k,c]) => [k, hueDist(hb, hueOf(c))]).filter(([,d]) => d < 30);
    out.push([clash.length ? 'warn' : 'ok', clash.length ? `待命球和“${clash.map(([k]) => STATUS_NAMES[k]).join('、')}”同色系` : '待命球和状态色分得开',

    const ballC = contrast(P.accent, P.side), same = hb != null &amp;&amp; hueOf(P.side) != null &amp;&amp; hueDist(hb, hueOf(P.side)) < 20;
    const weak = ballC < 1.3 || (same &amp;&amp; ballC < 1.5);
    out.push([!weak ? 'ok' : 'warn', `球和身体 ${ballC.toFixed(2)}:1`, !weak ? '' : '球和身体太接近，天线球不够醒目。']);

  const sw = (o, kind) => { const c = o.same ? bodyHex() : hexOf(o); const on = kind === 'body' ? S.body === o : S.ball === o;

  const ALL_BODIES = BODIES; BODIES.forEach((o,i) => o._i = i); BALLS.forEach((o,i) => o._i = i);

    const P = palette();
    syncCustom('body', P.side, S.body._i === -1); syncCustom('ball', P.accent, S.ball._i === -1);
    document.getElementById('big').innerHTML = render('idle', opt(P,{compact:1})) + render('idle', opt(P,{compact:1, view: S.finish === 'plush' ? 'front' : 'flat'}));
    document.getElementById('states').innerHTML = [['thinking','思考'],['coding','执行'],['awaiting','需要你'],['done','完成'],['error','异常'],['sleeping','离线']]
      .map(([id,n]) => `<div>${render(id, opt(P,{compact:1}))}${n}</div>`).join('');
    document.getElementById('tiny').innerHTML = '小尺寸 ' + [32,22,18].map(px => `<span><span style=&quot;display:block;width:${px}px;height:${px}px&quot;>${render('idle', opt(P,{tiny:true}))}</span>${px}px</span>`).join('');
    document.getElementById('checks').innerHTML = checks(P).map(([lv, title, tip]) => `<li data-level=&quot;${lv}&quot;><b>${lv === 'ok' ? '✓' : '!'} ${title}</b>${tip ? '：' + tip : ''}</li>`).join('');
    window.__P = P;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('.swatch'); if (!b) return;
    if (b.dataset.kind === 'body') S.body = ALL_BODIES[+b.dataset.i]; else S.ball = BALLS[+b.dataset.i];
    draw();
  });
  // 自定义：色盘和 HEX 输入框都是静态元素，重绘不会打断拖动取色
  function syncCustom(kind, hex, on){
    const wrap = document.getElementById(kind + 'PickWrap'), input = document.getElementById(kind + 'Hex');

  for (const kind of ['body','ball']) {
    document.getElementById(kind + 'Pick').oninput = e => setCustom(kind, e.target.value);

  --openbitfun-color-status-success-emphasis: #1aa73e;
  --openbitfun-color-status-warning-emphasis: #ff8c00;
  --openbitfun-color-status-danger-emphasis: #ec221f;
  --openbitfun-color-field-background: #1c1c1f;
  --openbitfun-color-field-border: rgba(255, 255, 255, 0.18);
  --openbitfun-color-field-border-focus: #858585;
}
:root{color-scheme:light}
[data-openbitfun-design-system-root]{--ink:var(--openbitfun-color-content-primary);--sub:var(--openbitfun-color-content-secondary);--mute:var(--openbitfun-color-content-muted);--line:var(--openbitfun-color-border-subtle);--bg:var(--openbitfun-color-surface-scene);--card:var(--openbitfun-color-surface-raised)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;font-family:var(--openbitfun-font-family-sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:56px 32px 96px}
h1{font-size:34px;line-height:1.25;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:22px;margin:0 0 6px}
.lead{color:var(--sub);max-width:760px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-bottom:10px}
section{margin-top:64px}
.sec-desc{color:var(--sub);margin:0 0 24px;max-width:780px}

/* hero */
.hero{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:center;margin-top:36px}
.hero-fig{background:var(--card);border:1px solid var(--line);border-radius:28px;aspect-ratio:1;display:grid;place-items:center;position:relative}
.hero-fig svg{width:78%}
.hero-fig .tag{position:absolute;left:16px;top:14px;font-size:12px;color:var(--mute)}
.dna{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.dna div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.dna b{display:block;font-size:15px;margin-bottom:2px}
.dna span{color:var(--sub);font-size:13.5px}
.dna i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}

/* 设计理念 */
.muse{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.muse .p{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.muse .n{font-size:12px;color:var(--mute)}
.muse h3{font-size:16px;margin:4px 0 6px}
.muse p{margin:0;color:var(--sub);font-size:13.5px}
.muse .to{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px}
.muse .to em{font-style:normal;color:var(--mute);font-size:12px;display:block}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.legend span{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:13px}
.legend i{width:12px;height:12px;border-radius:50%}

/* state cards */
.group-title{display:flex;align-items:center;gap:10px;margin:34px 0 14px;font-weight:600}
.group-title i{width:10px;height:10px;border-radius:50%}
.group-title small{font-weight:400;color:var(--mute)}
.stagebar{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;color:var(--mute)}
.stagebar .seg2{display:inline-flex;gap:2px;background:var(--openbitfun-color-surface-workbench);border-radius:999px;padding:3px}
.live .seg2{display:inline-flex;gap:2px;background:var(--openbitfun-color-surface-workbench);border-radius:999px;padding:3px}
.stagebar button{font:inherit;font-size:13px;border:0;background:none;color:var(--sub);padding:5px 14px;border-radius:999px;cursor:pointer}
.stagebar button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.live .seg2 button{font:inherit;font-size:13px;border:0;background:none;color:var(--sub);padding:5px 14px;border-radius:999px;cursor:pointer}
.live .seg2 button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sgrid{--frame:#f3f3f5;--tile:#fbfbfc;--tink:#171717;--tsub:#6a6a6a;--tmute:#8f8f92;--tline:rgba(16,26,39,.08);--top:rgba(255,255,255,.95);--bloom:16%;--hi:rgba(255,255,255,.9);--edge:rgba(16,26,39,.06);
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--frame);padding:10px;border-radius:28px;transition:background .25s}
.sgrid[data-t=dark]{--frame:#0a0a0b;--tile:#141416;--tink:#ededed;--tsub:#9a9a9f;--tmute:#77777c;--tline:rgba(255,255,255,.1);--top:rgba(255,255,255,.07);--bloom:26%;--hi:rgba(255,255,255,.06);--edge:rgba(255,255,255,.06)}

.scell{position:relative;border-radius:20px;overflow:hidden;color:var(--tink);box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 var(--hi);
  background:radial-gradient(60% 46% at 50% 33%,color-mix(in srgb,var(--c) var(--bloom),transparent),transparent 72%),radial-gradient(120% 70% at 50% 0%,var(--top),transparent 60%),var(--tile)}
.scell .fig{width:100%;margin:14px auto 0}.scell .fig svg{display:block;width:100%;overflow:visible}

.smeta dl{margin:10px 0 0;display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--tline)}

.smeta dd{margin:0;font-size:12.5px;line-height:1.6;color:var(--tsub)}
.smeta dd.when{color:var(--tink)}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:12.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,24,33,.05)}
.pill .av{width:22px;height:22px;display:block}
.pill .av svg{width:100%;height:100%}
.pill .lv{width:6px;height:6px;border-radius:50%;margin-left:2px;animation:lv 1.2s ease-in-out infinite}
@keyframes lv{50%{opacity:.25}}

/* sizes */
.sizes{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 24px}
.sizes .row{display:grid;grid-template-columns:90px repeat(14,1fr);align-items:center;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.sizes .row:last-child{border-bottom:0}
.sizes .lab{font-size:12.5px;color:var(--mute)}
.sizes .cell{display:grid;place-items:center;font-size:11.5px;color:var(--sub);text-align:center}
.sizes .cell svg{display:block}

/* demo */
.demo{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
.phone{background:var(--openbitfun-color-surface-raised);border:10px solid var(--ink);border-radius:44px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone .top{height:94px;padding:44px 18px 0;display:flex;justify-content:center;align-items:flex-start;border-bottom:1px solid #F2F2F2}
.phone .top .title{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:12px;color:var(--mute)}
.phone .msgs{flex:1;padding:18px 18px 0;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.bubble-u{align-self:flex-end;background:var(--openbitfun-color-surface-workbench);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:80%;font-size:14px}
.arow{display:flex;gap:10px;align-items:flex-start}
.arow .m{width:34px;height:34px;flex:none}
.arow .m svg{width:100%;height:100%}
.arow .txt{font-size:14px;padding-top:6px}
.steps{list-style:none;margin:6px 0 0;padding:0;font-size:13px;color:var(--sub)}
.steps li{padding:2px 0;display:flex;gap:8px;align-items:center}
.steps li::before{content:&quot;&quot;;width:6px;height:6px;border-radius:50%;background:var(--openbitfun-color-border-default)}
.steps li.on{color:var(--ink)}
.steps li.on::before{background:currentColor}
.hero-live{display:grid;place-items:center;height:210px;margin-top:auto}
.hero-live svg{width:220px}
.phone .composer{margin:12px 14px 18px;height:46px;border-radius:23px;background:var(--openbitfun-color-surface-workbench);display:flex;align-items:center;padding:0 16px;color:var(--mute);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.sel{border-color:var(--ink)}
.timeline{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;font-size:13.5px;color:var(--sub)}
.timeline ol{margin:8px 0 0;padding-left:18px}
.timeline li{padding:3px 0}
.timeline li.cur{color:var(--ink);font-weight:600}

.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rules div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:13.5px;color:var(--sub)}
.rules b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.live{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);gap:var(--openbitfun-space-6,24px);align-items:center;background:var(--openbitfun-color-surface-subtle,#f6f6f4);border-radius:24px;padding:24px}
.live-stage{position:relative;border-radius:20px;background:radial-gradient(70% 60% at 50% 35%,#fff,transparent 75%),var(--openbitfun-color-surface-default,#fff);aspect-ratio:1/1;max-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab}
.live-turn{width:78%;transition:transform .22s ease-in}.live-turn.out{transform:perspective(600px) rotateY(88deg) scale(.96)}
.live-fig{position:relative;width:100%;transform-origin:50% 88%;will-change:transform}.live-fig svg{display:block;width:100%;overflow:visible}
.live-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:var(--sub)}
.live-ctrl{display:flex;flex-direction:column;gap:16px}.live-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.live-row .lab{font-size:13px;color:var(--sub);width:36px}
.live-sw{display:flex;gap:8px;flex-wrap:wrap}.live-sw button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}.live-sw button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.live-btn{font:inherit;font-size:13px;padding:8px 18px;border-radius:999px;border:1px solid rgba(0,0,0,.14);background:#fff;cursor:pointer}.live-btn:hover{background:#f3f3f1}
@media (max-width:760px){.live{grid-template-columns:1fr}}
.matrix{display:block}
.mboard{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mchip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer;color:var(--ink)}
.mchip i{width:18px;height:18px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

.mchip.on{border-color:var(--ink)}

.mrow .cell{display:flex;flex-direction:column;align-items:center;padding-bottom:10px}
.mrow .cell span{font-size:12px;color:var(--mute)}
.matrix .rl{display:flex;align-items:center;font-size:13px;color:var(--sub)}

.bar .sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;background:#fff;cursor:pointer}

.cc-h{font-size:15px;margin:30px 0 12px;font-weight:600}

<body data-openbitfun-design-system-root data-color-scheme=&quot;light&quot;>
<div class=&quot;wrap&quot;>
  <div class=&quot;eyebrow&quot;>OpenBitFun · Mascot System v1.0</div>

  <p class=&quot;lead&quot;>方块毕方的 14 个工作状态：天线球表示状态，眼睛表示情绪。</p>

  <section class=&quot;lore&quot;>
    <h2>名字的来历：《山海经》里的毕方</h2>
    <p class=&quot;sec-desc&quot;>出自《山海经·西山经》：</p>
    <blockquote>又西二百八十里，曰章莪之山……有鸟焉，其状如鹤，一足，赤文青质而白喙，名曰毕方，其鸣自叫也，见则其邑有讹火。</blockquote>
    <p class=&quot;sec-desc&quot;>样子像鹤，一只脚，青身红纹白嘴；它出现的地方会起怪火。</p>
    <div class=&quot;lore-grid&quot;>
      <div><b>火的征兆</b>“见则有讹火”，是火灾的兆头。</div>
      <div><b>人面一脚</b>《海外南经》：“其为鸟人面一脚”。</div>

    <p class=&quot;sec-desc&quot; style=&quot;margin-top:16px&quot;><b>和形象的对应：</b>天线是那“一足”；毕方配色取青身、珊瑚腮红、白喙。</p>

        <div class=&quot;live-row&quot;><span class=&quot;lab&quot;>状态</span><span class=&quot;seg2&quot; id=&quot;liveState&quot;></span></div>

    {

      // 完成 · 备选：实心弯月笑眼
      case 'happyCrescent': s = E.map(([a, b]) => `<path d=&quot;M${a - 3.2} ${b + 1.8} Q${a} ${b - 5.6} ${a + 3.2} ${b + 1.8} Q${a} ${b - 1.4} ${a - 3.2} ${b + 1.8}Z&quot; fill=&quot;${ec}&quot; stroke=&quot;${ec}&quot; stroke-width=&quot;.6&quot; stroke-linejoin=&quot;round&quot;/>`).join(''); break;
      // 离线：眼睛收成低处的一条短胶囊，像合上的眼缝
      case 'closed': s = E.map(([a, b]) => `<rect x=&quot;${a - 2.8}&quot; y=&quot;${b + 1.4}&quot; width=&quot;5.6&quot; height=&quot;2&quot; rx=&quot;1&quot; fill=&quot;${ec}&quot;/>`).join(''); break;
      // 离线 · 备选：缩小的点状眼（像熄屏的指示灯）
      case 'closedDot': s = E.map(([a, b]) => `<circle cx=&quot;${a}&quot; cy=&quot;${b + 1.6}&quot; r=&quot;1.5&quot; fill=&quot;${ec}&quot; opacity=&quot;.7&quot;/>`).join(''); break;
      case 'xx': { const [[a, b], [c, d]] = E; s = `<path d=&quot;M${a - 1.8} ${b - 2.6} L${a + 1.8} ${b} L${a - 1.8} ${b + 2.6}&quot; ${st(2.5)}/><path d=&quot;M${c + 1.8} ${d - 2.6} L${c - 1.8} ${d} L${c + 1.8} ${d + 2.6}&quot; ${st(2.5)}/>`; break; }
      default: s = E.map(([a, b]) => `<g class=&quot;blink&quot;><ellipse cx=&quot;${a}&quot; cy=&quot;${b}&quot; rx=&quot;2.9&quot; ry=&quot;5.3&quot; fill=&quot;${ec}&quot;/>${shine(a, b)}</g>`).join('');
    }
    return `<g transform=&quot;${face(x)}&quot;${x.plush ? ` filter=&quot;url(#ev${x.u})&quot;` : ''}><g transform=&quot;translate(${dx} ${dy})&quot;><g${cls}>${s}</g></g></g>`;  // 毛绒：眼睛做成有体积的小珠子
  }

  const blush = (x, op = .75) => !x.cute || x.P.bifang || x.blushPick !== undefined ? '' : `<g transform=&quot;${face(x)}&quot; fill=&quot;${x.P.blush}&quot; opacity=&quot;${op}&quot;><ellipse cx=&quot;4&quot; cy=&quot;20.2&quot; rx=&quot;3&quot; ry=&quot;1.7&quot;/><ellipse cx=&quot;30&quot; cy=&quot;20.2&quot; rx=&quot;3&quot; ry=&quot;1.7&quot;/></g>`;
  const soft = x => blush(x, x.P.softOp || .45);
  // 鸟嘴（白喙）：毕方默认带；其他颜色在“自己搭配”里选“鸟嘴”也可以加。浅色身体上白喙看不见，改用暖黄色
  function beakOf(x) {
    const beak = relLum(x.P.side) > .6 ? '#F2B04E' : '#F4F1EA', t = x.tiny;
    if (x.flat) return `<path d=&quot;M58.6 ${t ? 72 : 70.2} L61.4 ${t ? 72 : 70.2} L60 ${t ? 75.6 : 73}Z&quot; fill=&quot;${beak}&quot; stroke=&quot;${beak}&quot; stroke-width=&quot;.9&quot; stroke-linejoin=&quot;round&quot;/>`;
    return `<g transform=&quot;${FACE}&quot;${x.plush ? ` filter=&quot;url(#ev${x.u})&quot;` : ''}><path d=&quot;M15.2 15.7 Q17.1 15.2 19 15.7 L17.3 19Z&quot; fill=&quot;${beak}&quot; stroke=&quot;${beak}&quot; stroke-width=&quot;.8&quot; stroke-linejoin=&quot;round&quot;/></g>`;
  }
  function mouth(x, type, fixed) {
    if (x.mouthPick &amp;&amp; !fixed) { if (x.mouthPick !== 'state') return ''; } else if (!x.cute &amp;&amp; !fixed) return '';
    const ec = x.P.eye, st = `fill=&quot;none&quot; stroke=&quot;${ec}&quot; stroke-width=&quot;1.35&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;`;
    const m = {
      smile: `<path d=&quot;M15.4 18.6 Q17 20.6 18.6 18.6&quot; ${st}/>`,
      cat: `<path d=&quot;M14.6 18.7 Q15.8 20.3 17 18.9 Q18.2 20.3 19.4 18.7&quot; ${st}/>`,
      o: `<ellipse cx=&quot;17&quot; cy=&quot;19.3&quot; rx=&quot;1.15&quot; ry=&quot;1.45&quot; fill=&quot;${ec}&quot;/>`,
      grin: `<path d=&quot;M14.6 18 Q17 23.2 19.4 18 Z&quot; fill=&quot;${ec}&quot;/>`,
      wavy: `<path d=&quot;M14.6 19.4 q1.2 -1.3 2.4 0 t2.4 0&quot; ${st}/>`,
      flat: `<path d=&quot;M15.6 19.2 H18.4&quot; ${st}/>`
    }[type];
    return `<g transform=&quot;${face(x)}&quot;${x.plush ? ` filter=&quot;url(#ev${x.u})&quot;` : ''}>${m}</g>`;
  }

  function antenna(x, color, fx = [], cls = 'ant') {
    const { P, u, plush } = x;
    if (x.tiny) fx = [];
    let under = '', over = '', ballCls = '';
    if (P.ring) under += x.tiny ? `<circle cx=&quot;60&quot; cy=&quot;27&quot; r=&quot;14.2&quot; fill=&quot;${P.ring}&quot;/>` : x.flat ? `<circle cx=&quot;60&quot; cy=&quot;28&quot; r=&quot;11.2&quot; fill=&quot;${P.ring}&quot;/>` : `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;13&quot; fill=&quot;${P.ring}&quot;/>`;
    if (fx.includes('glow')) under += `<circle class=&quot;glow&quot; cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;${color}&quot;/>`;
    if (fx.includes('ripple')) under += `<circle class=&quot;rip&quot; cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-width=&quot;1.6&quot;/><circle class=&quot;rip rip2&quot; cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-width=&quot;1.6&quot;/>`;
    if (fx.includes('flash')) ballCls = ' class=&quot;flash&quot;';
    if (fx.includes('pulse')) ballCls = ' class=&quot;pulse&quot;';
    if (fx.includes('spin')) over += `<g class=&quot;spin&quot;><circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;15&quot; fill=&quot;none&quot;/><path d=&quot;M60 14 A15 15 0 0 1 75 29&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot;/></g>`;
    if (fx.includes('orbit')) over += `<g><circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;17&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-opacity=&quot;.28&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;1.5 3&quot;/><circle cx=&quot;77&quot; cy=&quot;29&quot; r=&quot;2.6&quot; fill=&quot;${color}&quot;><animateTransform attributeName=&quot;transform&quot; type=&quot;rotate&quot; from=&quot;0 60 29&quot; to=&quot;360 60 29&quot; dur=&quot;1.8s&quot; repeatCount=&quot;indefinite&quot;/></circle></g>`;
    if (fx.includes('smoke')) over += `<circle class=&quot;puff&quot; cx=&quot;67&quot; cy=&quot;14&quot; r=&quot;3.2&quot; fill=&quot;#B9BEC7&quot;/><circle class=&quot;puff p2&quot; cx=&quot;71&quot; cy=&quot;12&quot; r=&quot;2.4&quot; fill=&quot;#B9BEC7&quot;/>`;
    const be = edgeOf(color), bs = be ? ` stroke=&quot;${be}&quot; stroke-width=&quot;${x.tiny ? 2 : 1.1}&quot;` : '';
    const ball = x.tiny ? `<circle cx=&quot;60&quot; cy=&quot;27&quot; r=&quot;12.5&quot; fill=&quot;${color}&quot;${bs}/>` : x.flat ? `<circle cx=&quot;60&quot; cy=&quot;28&quot; r=&quot;9.6&quot; fill=&quot;${color}&quot;${bs}/>${x.front ? `<circle cx=&quot;60&quot; cy=&quot;28&quot; r=&quot;9.6&quot; fill=&quot;url(#bm${u})&quot;/>` : ''}` : `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;${color}&quot;${bs}/>${plush ? `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;url(#bm${u})&quot;/>` : `<circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;url(#bs${u})&quot;/>`}${plush ? '' : `<ellipse cx=&quot;55.6&quot; cy=&quot;23.8&quot; rx=&quot;4&quot; ry=&quot;2.6&quot; transform=&quot;rotate(-30 55.6 23.8)&quot; fill=&quot;#fff&quot; opacity=&quot;.6&quot; filter=&quot;url(#hb${u})&quot;/><circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.1&quot; fill=&quot;none&quot; stroke=&quot;#000&quot; stroke-opacity=&quot;.1&quot; stroke-width=&quot;.8&quot;/>`}`;
    return `<g class=&quot;${cls}&quot;>
      ${x.front ? `<ellipse cx=&quot;60&quot; cy=&quot;49&quot; rx=&quot;4.4&quot; ry=&quot;1.8&quot; fill=&quot;#000&quot; opacity=&quot;.2&quot; filter=&quot;url(#hb${u})&quot;/><rect x=&quot;58.2&quot; y=&quot;35&quot; width=&quot;3.6&quot; height=&quot;14.5&quot; rx=&quot;1.8&quot; fill=&quot;url(#cr${u})&quot;/>` : x.flat ? `<rect x=&quot;58.3&quot; y=&quot;36&quot; width=&quot;3.4&quot; height=&quot;10.2&quot; fill=&quot;${edgeOf(P.side) || P.side}&quot;/>`
        : `${plush ? `<ellipse cx=&quot;60&quot; cy=&quot;54.4&quot; rx=&quot;5.2&quot; ry=&quot;2.4&quot; fill=&quot;#000&quot; opacity=&quot;.22&quot; filter=&quot;url(#hb${u})&quot;/><rect x=&quot;57.4&quot; y=&quot;30&quot; width=&quot;5.2&quot; height=&quot;24&quot; rx=&quot;2.6&quot; fill=&quot;url(#cr${u})&quot;/>` : `<rect x=&quot;57.4&quot; y=&quot;30&quot; width=&quot;5.2&quot; height=&quot;23.5&quot; rx=&quot;2.6&quot; fill=&quot;url(#cr${u})&quot;/><ellipse cx=&quot;60&quot; cy=&quot;53.8&quot; rx=&quot;7&quot; ry=&quot;3.6&quot; fill=&quot;url(#cc${u})&quot;/><ellipse cx=&quot;60&quot; cy=&quot;53.1&quot; rx=&quot;4&quot; ry=&quot;1.7&quot; fill=&quot;#fff&quot; opacity=&quot;.55&quot;/>`}`}
      <g transform=&quot;${x.flat ? '' : 'translate(0 -10) translate(60 29) scale(1.14) translate(-60 -29)'}&quot;>
      ${under}
      <g${ballCls}>${ball}</g>
      ${over}
      </g>
    </g>`;
  }

  const hand = (x, hx, hy, cls = '') => `<ellipse${cls ? ` class=&quot;${cls}&quot;` : ''} cx=&quot;${hx}&quot; cy=&quot;${hy}&quot; rx=&quot;4.8&quot; ry=&quot;3.8&quot; fill=&quot;${x.P.hand}&quot;${x.plush ? ` filter=&quot;url(#fz${x.u})&quot;` : ''}/>`;
  const sparkle = (sx, sy, r, color, cls) => `<path class=&quot;spark ${cls}&quot; d=&quot;M${sx} ${sy - r} Q${sx} ${sy} ${sx + r} ${sy} Q${sx} ${sy} ${sx} ${sy + r} Q${sx} ${sy} ${sx - r} ${sy} Q${sx} ${sy} ${sx} ${sy - r}Z&quot; fill=&quot;${color}&quot;/>`;

  function mini(x, tx, ty, color, cls) {
    const { P } = x;
    return `<g transform=&quot;translate(${tx} ${ty}) scale(.34)&quot;><g class=&quot;${cls}&quot;${x.plush ? ` filter=&quot;url(#fz${x.u})&quot;` : ''}>
      ${x.flat ? `<rect x=&quot;26&quot; y=&quot;46&quot; width=&quot;68&quot; height=&quot;54&quot; rx=&quot;20&quot; fill=&quot;${P.side}&quot;/><rect x=&quot;57.5&quot; y=&quot;38&quot; width=&quot;5&quot; height=&quot;9&quot; fill=&quot;${P.side}&quot;/>` : `<path d=&quot;${SIL}&quot; fill=&quot;${P.side}&quot; stroke=&quot;${P.side}&quot; stroke-width=&quot;18&quot; stroke-linejoin=&quot;round&quot;/>
      <path d=&quot;${TOP}&quot; fill=&quot;${P.top1}&quot; opacity=&quot;.55&quot;/>
      <line x1=&quot;60&quot; y1=&quot;53&quot; x2=&quot;60&quot; y2=&quot;41&quot; stroke=&quot;${P.stem}&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot;/>`}
      <circle cx=&quot;60&quot; cy=&quot;29&quot; r=&quot;11.5&quot; fill=&quot;${color}&quot;/>
      <g transform=&quot;${face(x)}&quot; fill=&quot;${P.eye}&quot;><ellipse cx=&quot;9.5&quot; cy=&quot;12&quot; rx=&quot;3.4&quot; ry=&quot;5.8&quot;/><ellipse cx=&quot;24.5&quot; cy=&quot;12&quot; rx=&quot;3.4&quot; ry=&quot;5.8&quot;/></g>
    </g></g>`;
  }

  /* ---------- 状态定义 ---------- */
  const STATES = [
    { id: 'idle', cat: 'idle', name: '待命', en: 'Idle', pill: '在线 · 随时待命',
      when: '已连接设备、没有进行中的任务；首页与会话空闲时。',
      notes: '还原视频里的动作：先压扁蓄力，再左右摇摆几下回正，天线跟着甩；平时眨眼。默认只有眼睛；切到“萌”表情时会加“ω”小嘴和淡腮红。', wrap: 'idle' },
    { id: 'listening', cat: 'think', name: '聆听', en: 'Listening', pill: '正在听你说…',
      when: '语音输入中，或用户正在输入长消息时。',
      notes: '眼睛放大表示“专注于你”；天线发出声波涟漪，侧边频谱条跟随音量。', wrap: 'f' },
    { id: 'thinking', cat: 'think', name: '思考', en: 'Thinking', pill: '思考中…',
      when: '收到请求、模型首个 token 之前的短暂思考。',
      notes: '视线上飘到右上，思考气泡里三点依次跳动；天线紫色呼吸光晕。', wrap: 'f' },
    { id: 'reasoning', cat: 'think', name: '深度推理', en: 'Deep reasoning', pill: '深度推理 · 已思考 18s',
      when: '开启深度思考 / 长链推理，耗时较长时。',
      notes: '眯眼用力想；天线有一颗卫星点绕行。和“思考”的区别只在眼型和天线动效，不加背景装饰。', wrap: 'f-slow' },
    { id: 'planning', cat: 'think', name: '规划', en: 'Planning', pill: '拆解任务 · 3 步',
      when: '生成 Plan / Todo、拆分子任务时。',
      notes: '左手举着清单，勾选逐条出现；视线看向清单。', wrap: 'f' },
    { id: 'coding', cat: 'work', name: '写代码', en: 'Coding', pill: '编辑 src/app.ts',
      when: 'Agent 正在生成 / 修改文件。',
      notes: '“敲键盘”：双手在身前交替敲击，右侧编辑器逐行长出代码。专注眼（上眼睑压平）。', wrap: '' },
    { id: 'searching', cat: 'work', name: '检索阅读', en: 'Searching', pill: '读取 12 个文件',
      when: '搜索代码库、读文件、联网查资料。',
      notes: '放大镜在文档上扫视，眼睛与放大镜同步移动——视线就是“正在看哪里”。', wrap: 'f' },
    { id: 'running', cat: 'work', name: '运行构建', en: 'Running', pill: '运行测试 · 42/60',
      when: '执行终端命令、构建、跑测试。',
      notes: '天线球外圈变成加载环；右侧终端里进度条推进。等待型任务不加手部动作。', wrap: 'f' },
    { id: 'debugging', cat: 'work', name: '调试排错', en: 'Debugging', pill: '定位问题 · TypeError',
      when: '发现报错后自主排查、修复中。',
      notes: '举放大镜盯着一只小虫，额头冒汗——主动在处理，表情专注而不是沮丧。', wrap: 'f' },
    { id: 'collab', cat: 'work', name: '多 Agent 协作', en: 'Sub-agents', pill: '3 个子任务并行',
      when: '派生子 Agent 并行处理、跨设备协同。',
      notes: '召唤出两只迷你方块分身，天线之间有数据流；本体左右看着分身——“我在统筹”。', wrap: 'f' },
    { id: 'awaiting', cat: 'ask', name: '等你确认', en: 'Needs you', pill: '需要你确认 · 2 处修改',
      when: '需要授权（执行命令、写文件、付费操作）或需要用户补充信息。',
      notes: '唯一会主动吸引注意的状态：举手挥动，天线球琥珀色闪烁；“萌”表情下另加腮红。', wrap: 'f' },
    { id: 'done', cat: 'ok', name: '完成', en: 'Done', pill: '已完成 · 修改 5 个文件',

    { id: 'error', cat: 'err', name: '出错', en: 'Error', pill: '构建失败 · 查看日志',
      when: '任务失败且无法自动恢复、网络中断。',
      notes: '“> <”挤眼 + 短促果冻摇晃，天线红色闪烁冒烟。胶囊给出明确下一步。', wrap: 'shake' },
    { id: 'sleeping', cat: 'off', name: '休眠 / 离线', en: 'Offline', pill: '离线 · 电脑已休眠',
      when: '设备断开、电脑休眠、长时间无操作。',
      notes: '眼睛收成一条眼缝，天线耷拉并变灰，缓慢呼吸，Zzz 升起。以“睡着”替代生硬的断开图标。', wrap: 'breathe' }
  ];

  function parts(id, x, c, compact) {
    const B = body(x) + (x.P.bifang ? bifangMarks(x) : '');
    switch (id) {
      case 'idle': return [B, antenna(x, c, [], 'ant-idle'), eyes(x, 'normal'), soft(x), mouth(x, 'cat')];
      case 'listening': return [B, antenna(x, c, ['ripple']), eyes(x, 'wide'), soft(x), mouth(x, 'smile'),
        !compact &amp;&amp; `<g fill=&quot;${c}&quot;><rect class=&quot;eq&quot; x=&quot;103&quot; y=&quot;58&quot; width=&quot;4&quot; height=&quot;20&quot; rx=&quot;2&quot;/><rect class=&quot;eq e2&quot; x=&quot;110&quot; y=&quot;54&quot; width=&quot;4&quot; height=&quot;28&quot; rx=&quot;2&quot;/><rect class=&quot;eq e3&quot; x=&quot;117&quot; y=&quot;60&quot; width=&quot;4&quot; height=&quot;16&quot; rx=&quot;2&quot;/></g>`];
      case 'thinking': return [B, antenna(x, c, ['glow']), eyes(x, 'normal', { dx: 1.5, dy: -2.5 }), soft(x), mouth(x, 'o'),
        !compact &amp;&amp; `<circle cx=&quot;97&quot; cy=&quot;40&quot; r=&quot;2.2&quot; fill=&quot;#fff&quot; filter=&quot;url(#ps${x.u})&quot;/><circle cx=&quot;103&quot; cy=&quot;31&quot; r=&quot;3.2&quot; fill=&quot;#fff&quot; filter=&quot;url(#ps${x.u})&quot;/>
         <rect x=&quot;102&quot; y=&quot;4&quot; width=&quot;32&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;#fff&quot; filter=&quot;url(#ps${x.u})&quot;/>
         <g fill=&quot;${c}&quot;><circle class=&quot;dot&quot; cx=&quot;111&quot; cy=&quot;13&quot; r=&quot;2.1&quot;/><circle class=&quot;dot d2&quot; cx=&quot;118&quot; cy=&quot;13&quot; r=&quot;2.1&quot;/><circle class=&quot;dot d3&quot; cx=&quot;125&quot; cy=&quot;13&quot; r=&quot;2.1&quot;/></g>`];
      case 'reasoning': return [B, antenna(x, c, ['orbit']), eyes(x, 'squint'), soft(x), mouth(x, 'wavy')];
      case 'planning': return [B, antenna(x, c, ['glow']), eyes(x, 'normal', { dx: -2, dy: 1 }), soft(x), mouth(x, 'smile'),
        !compact &amp;&amp; `<g transform=&quot;translate(9 0)&quot;><rect x=&quot;-17&quot; y=&quot;46&quot; width=&quot;31&quot; height=&quot;44&quot; rx=&quot;5&quot; fill=&quot;#fff&quot; filter=&quot;url(#ps${x.u})&quot;/>
         ${[58, 69, 80].map((y, i) => `<rect x=&quot;-12&quot; y=&quot;${y - 3.5}&quot; width=&quot;7&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;none&quot; stroke=&quot;${tint(c, .45)}&quot; stroke-width=&quot;1.3&quot;/>
           <path class=&quot;chk ${['', 'k2', 'k3'][i]}&quot; d=&quot;M-10.5 ${y} l2 2 l4 -4.5&quot; fill=&quot;none&quot; stroke=&quot;${c}&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>
           <rect x=&quot;-2&quot; y=&quot;${y - 1.4}&quot; width=&quot;${[12, 9, 11][i]}&quot; height=&quot;2.8&quot; rx=&quot;1.4&quot; fill=&quot;${tint(c, .7)}&quot;/>`).join('')}</g>`,
        !compact &amp;&amp; hand(x, 23, 82)];

  /* ---------- 颜色解析：待命=配色主色；同色系冲突时用加深版 ---------- */
  function hueOf(h) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255), M = Math.max(r, g, b), m = Math.min(r, g, b), d = M - m;
    if (d < .06) return null; // 近中性色没有色相
    const x = M === r ? ((g - b) / d) % 6 : M === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (x * 60 + 360) % 360;
  }
  const chroma = h => { const v = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255); return Math.max(...v) - Math.min(...v); };
  const hueDist = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 360 - d); };
  // 身体与状态色相差 < 30° 时自动换成加深版
  function isDeep(cat, palette) {
    const P = typeof palette === 'object' ? palette : PALETTES[palette || 'obsidian'], hb = hueOf(P.side), hs = hueOf(CAT[cat].color);
    if (P.status) return false;
    return cat !== 'idle' &amp;&amp; cat !== 'off' &amp;&amp; hb != null &amp;&amp; hs != null &amp;&amp; chroma(P.side) >= .15 &amp;&amp; hueDist(hb, hs) < 30;
  }
  function statusColor(cat, palette) {
    const P = typeof palette === 'object' ? palette : PALETTES[palette || 'obsidian'];
    if (cat === 'idle') return P.accent;
    if (P.status &amp;&amp; P.status[cat]) return P.status[cat];
    return isDeep(cat, palette) ? CAT[cat].deep : CAT[cat].color;
  }

  /* ---------- 点缀：替代卡通道具的线框小标记（opt.accent） ---------- */
  // 线框图形本身，坐标范围约 ±10；bg=true 时线宽不随缩放变粗，用于大尺寸背景纹样
  function accentGlyph(id, c, bg = false) {
    const L = `fill=&quot;none&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${bg ? 1.3 : 1.6}&quot;${bg ? ' vector-effect=&quot;non-scaling-stroke&quot;' : ''} stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;`;
    const k = bg ? .5 : 1; // 背景版：实心点缩小，保持线稿感
    return {
      idle: `<circle r=&quot;7&quot; ${L} opacity=&quot;.35&quot;/><circle class=&quot;ac-breathe&quot; r=&quot;${3 * k}&quot; fill=&quot;${c}&quot;/>`,
      listening: [-6, -2, 2, 6].map((x, i) => `<line class=&quot;eq ${['', 'e2', 'e3', 'e2'][i]}&quot; x1=&quot;${x}&quot; y1=&quot;-7&quot; x2=&quot;${x}&quot; y2=&quot;7&quot; ${L}/>`).join(''),
      thinking: [-6, 0, 6].map((x, i) => `<circle class=&quot;dot ${['', 'd2', 'd3'][i]}&quot; cx=&quot;${x}&quot; cy=&quot;0&quot; r=&quot;${1.9 * k}&quot; fill=&quot;${c}&quot;/>`).join(''),
      reasoning: `<g class=&quot;ac-spin&quot;><path d=&quot;M0 -8 A8 8 0 0 1 8 0&quot; ${L}/><path d=&quot;M0 8 A8 8 0 0 1 -8 0&quot; ${L}/></g><g class=&quot;ac-spin-r&quot;><path d=&quot;M4 0 A4 4 0 0 1 0 4&quot; ${L} opacity=&quot;.55&quot;/><path d=&quot;M-4 0 A4 4 0 0 1 0 -4&quot; ${L} opacity=&quot;.55&quot;/></g>`,
      planning: [-6, 0, 6].map((y, i) => `<path class=&quot;chk ${['', 'k2', 'k3'][i]}&quot; d=&quot;M-8 ${y} l1.6 1.6 l2.8 -3&quot; ${L}/><line x1=&quot;-1&quot; y1=&quot;${y}&quot; x2=&quot;${[8, 5, 7][i]}&quot; y2=&quot;${y}&quot; ${L} opacity=&quot;.45&quot;/>`).join(''),
      coding: `<path d=&quot;M-4 -6 L-9 0 L-4 6 M4 -6 L9 0 L4 6&quot; ${L}/><line class=&quot;caret&quot; x1=&quot;1.4&quot; y1=&quot;-6&quot; x2=&quot;-1.4&quot; y2=&quot;6&quot; ${L}/>`,
      searching: `<g class=&quot;sweep&quot;><circle cx=&quot;-2&quot; cy=&quot;-2&quot; r=&quot;5.2&quot; ${L}/><line x1=&quot;1.8&quot; y1=&quot;1.8&quot; x2=&quot;6&quot; y2=&quot;6&quot; ${L}/></g>`,
      running: bg ? `<line x1=&quot;-9&quot; y1=&quot;0&quot; x2=&quot;9&quot; y2=&quot;0&quot; ${L} opacity=&quot;.3&quot;/><line class=&quot;prog&quot; x1=&quot;-9&quot; y1=&quot;0&quot; x2=&quot;9&quot; y2=&quot;0&quot; ${L}/>` : `<rect x=&quot;-9&quot; y=&quot;-1.6&quot; width=&quot;18&quot; height=&quot;3.2&quot; rx=&quot;1.6&quot; fill=&quot;${c}&quot; opacity=&quot;.2&quot;/><rect class=&quot;prog&quot; x=&quot;-9&quot; y=&quot;-1.6&quot; width=&quot;18&quot; height=&quot;3.2&quot; rx=&quot;1.6&quot; fill=&quot;${c}&quot;/>`,
      debugging: `<circle r=&quot;6.5&quot; ${L}/><path d=&quot;M0 -9.5 V-5 M0 5 V9.5 M-9.5 0 H-5 M5 0 H9.5&quot; ${L}/><circle class=&quot;ac-breathe&quot; r=&quot;${1.8 * k}&quot; fill=&quot;${c}&quot;/>`,
      collab: `<path d=&quot;M-7 5 L0 -6 L7 5 Z&quot; ${L} opacity=&quot;.4&quot;/>${[[-7, 5], [0, -6], [7, 5]].map(([x, y]) => `<circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;${2.3 * k}&quot; fill=&quot;${c}&quot;/>`).join('')}<circle r=&quot;${1.4 * k}&quot; fill=&quot;${c}&quot;><animateMotion dur=&quot;2.4s&quot; repeatCount=&quot;indefinite&quot; path=&quot;M0 -6 L7 5 L-7 5 Z&quot;/></circle>`,
      awaiting: `<circle class=&quot;ac-ping&quot; r=&quot;9&quot; ${L}/><circle r=&quot;${3.2 * k}&quot; fill=&quot;${c}&quot;/>`,
      done: `<path class=&quot;ac-draw&quot; d=&quot;M-7 0 L-2 5 L8 -6&quot; ${L} stroke-width=&quot;2&quot;/>`,
      error: `<path d=&quot;M0 -8 L8.5 7 H-8.5 Z&quot; ${L}/><line x1=&quot;0&quot; y1=&quot;-2&quot; x2=&quot;0&quot; y2=&quot;2.4&quot; ${L}/><circle cx=&quot;0&quot; cy=&quot;4.8&quot; r=&quot;.9&quot; fill=&quot;${c}&quot;/>`,
      sleeping: `<path d=&quot;M3 -8 A8 8 0 1 0 8 4 A6 6 0 1 1 3 -8 Z&quot; ${L}/><path class=&quot;zz&quot; d=&quot;M-9 -9 h3.5 l-3.5 4 h3.5&quot; ${L} stroke-width=&quot;1.3&quot;/>`
    }[id];
  }
  function accent(id, c) {
    return `<g transform=&quot;translate(118 26)&quot;><circle r=&quot;14&quot; fill=&quot;${c}&quot; opacity=&quot;.08&quot;/>${accentGlyph(id, c)}</g>`;
  }

  /* ---------- 渲染 ---------- */
  function render(id, opt = {}) {
    const st = STATES.find(s => s.id === id);
    const P = typeof opt.palette === 'object' ? opt.palette : PALETTES[opt.palette || 'obsidian'];
    const x = { P, u: 'b' + (++UID), plush: opt.finish === 'plush', metal: opt.finish === 'metal', cute: opt.face === 'cute', lod: opt.lod || 1, flat: opt.view === 'flat' || !!opt.tiny, tiny: !!opt.tiny, mouthPick: opt.mouth, blushPick: opt.blush === 'none' ? null : opt.blush };
    if (opt.blush === 'none') x.blushPick = '';
    x.front = opt.view === 'front' &amp;&amp; x.plush; if (opt.view === 'front') x.flat = true; // 正面毛绒：平面的正面构图 + 毛绒
    if (x.flat &amp;&amp; !x.front) { x.plush = false; x.metal = false; } // 平面只有一种：纯平、简化
    const color = statusColor(st.cat, opt.palette);
    const compact = !!opt.compact || !!opt.tiny, ac = !!opt.accent &amp;&amp; !x.tiny;
    const list = parts(id, x, color, compact || ac).filter(Boolean).join('') + (x.plush &amp;&amp; x.furOver ? x.furOver : (x.tiny ? '' : bifangBlush(x))) + (x.mouthPick === 'beak' ? beakOf(x) : x.mouthPick &amp;&amp; x.mouthPick !== 'state' &amp;&amp; x.mouthPick !== 'none' &amp;&amp; !x.tiny ? mouth(x, x.mouthPick, true) : '');
    const wrap = st.wrap === 'hop' &amp;&amp; (compact || ac) ? 'f' : st.wrap;
    const vb = x.tiny ? '20 13 80 90' : ac ? '34 6 122 120' : compact ? '9 1 102 107' : '0 0 160 136';
    const shadow = x.flat &amp;&amp; !x.front ? '' : false ? `<ellipse cx=&quot;60&quot; cy=&quot;104&quot; rx=&quot;27&quot; ry=&quot;2.6&quot; fill=&quot;#000&quot; opacity=&quot;.07&quot;/>` : `<ellipse cx=&quot;60&quot; cy=&quot;103.5&quot; rx=&quot;30&quot; ry=&quot;4.2&quot; fill=&quot;url(#sh${x.u})&quot;/>`;
    const inner = compact &amp;&amp; !ac ? `${shadow}<g class=&quot;${wrap}&quot;>${list}</g>` : `<g transform=&quot;translate(20 12)&quot;>${shadow}<g class=&quot;${wrap}&quot;>${list}</g>${ac ? accent(id, color) : ''}</g>`;
    const style = opt.noStyle ? '' : `<style>${STYLE}</style>`;
    return `<svg class=&quot;bf&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;${vb}&quot; role=&quot;img&quot; aria-label=&quot;毕方 · ${st.name}&quot;>${style}${defs(x)}${inner}</svg>`;
  }

  root.BF = { STATES, CAT, BOARD, makePalette, PALETTES, BASE, STYLE, render, accentGlyph, statusColor, isDeep, hueOf, hueDist };
  if (typeof module !== 'undefined') module.exports = root.BF;
})(typeof window !== 'undefined' ? window : globalThis);

    document.getElementById('ccPal').innerHTML = PK.map(k => { const P = PALETTES[k]; const ov = Object.keys(CAT).filter(c => BF.isDeep(c,k)).map(c => chip(statusColor(c,k), CAT[c].name + '·加深')).join('');
      return `<div class=&quot;pal&quot;><div class=&quot;fig&quot;>${R('idle',1,{palette:k,face:'refined',lod:.4})}</div><div class=&quot;nm&quot;><b>${P.name}</b><span>${P.note}</span></div>
      <div class=&quot;chips&quot;>${chip(P.top1,'顶面亮')}${chip(P.side,'身体')}${chip(P.sideL,'暗面')}${chip(P.eye,'眼睛')}${chip(P.stem,'天线杆')}${chip(P.accent,'待命主色')}${ov}</div></div>`; }).join('');
    document.getElementById('ccMatrix').innerHTML = `<div class=&quot;r&quot;><div></div>${catKeys.map(k => `<div class=&quot;h&quot;>${CAT[k].name}</div>`).join('')}</div>` +
      PK.map(k => { const P = PALETTES[k]; const rep = {idle:'idle',think:'thinking',work:'coding',ask:'awaiting',ok:'done',err:'error',off:'sleeping'};
        return `<div class=&quot;r&quot;><div class=&quot;l&quot;>${P.name}</div>${catKeys.map(c => { const col = statusColor(c,k), adj = BF.isDeep(c,k);
          return `<div class=&quot;c&quot;>${R(rep[c],1,{palette:k,lod:.35})}<code>${col}</code>${adj ? '<span class=&quot;adj&quot;>加深</span>' : ''}</div>`; }).join('')}</div>`; }).join('');
  }
  function set(f, p){ S.finish = f; S.palette = p; drawAll(); }

  // groups
  const order = ['idle','think','work','ask','ok','err','off'];
  const sorted = order.flatMap(k => STATES.filter(s => s.cat === k));
  // 状态全集：舞台卡片（顶光 + 状态色光晕 + 道具），浅色 / 深色舞台可切换；深色时道具卡换成深色玻璃
  let stageT = 'light';
  const glass = v => stageT !== 'dark' ? v : v.replace(/fill=&quot;#fff&quot; filter=/g,'fill=&quot;#24242a&quot; stroke=&quot;rgba(255,255,255,.08)&quot; filter=').replace(/fill=&quot;#F3F4F6&quot;/g,'fill=&quot;#24242a&quot;').replace(/fill=&quot;#D9DDE3&quot;/g,'fill=&quot;#3a3a42&quot;').replace(/stroke=&quot;#2A2D35&quot;/g,'stroke=&quot;#c9cbd1&quot;');
  document.getElementById('stageT').onclick = e => { const b = e.target.closest('button'); if (!b) return; stageT = b.dataset.v; [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawGroups(); };
  function drawGroups(){ document.getElementById('groups').innerHTML = `<div class=&quot;sgrid&quot; data-t=&quot;${stageT}&quot;>${sorted.map((s, n) => { const col = colorOf(s.id); return `<div class=&quot;scell&quot; id=&quot;st-${s.id}&quot; style=&quot;--c:${col}&quot;><span class=&quot;cat&quot;><i></i>${CAT[s.cat].name}</span><span class=&quot;no&quot;>${String(n+1).padStart(2,'0')}</span><div class=&quot;fig&quot;>${glass(R(s.id))}</div>
      <div class=&quot;smeta&quot;><div class=&quot;name&quot;>${s.name}</div><div class=&quot;en&quot;>${s.en}</div><dl><div><dt>出现时机</dt><dd class=&quot;when&quot;>${s.when}</dd></div></dl></div></div>`; }).join('')}</div>`; }

  // sizes
  const sizes = [56, 32, 22, 18];
  function drawSizes(){ document.getElementById('sizes').innerHTML =
    `<div class=&quot;row&quot;><div class=&quot;lab&quot;></div>${STATES.map(s => `<div class=&quot;cell&quot;>${s.name}</div>`).join('')}</div>` +
    sizes.map(px => `<div class=&quot;row&quot;><div class=&quot;lab&quot;>${px}px</div>${STATES.map(s => `<div class=&quot;cell&quot;><div style=&quot;width:${px}px;height:${px}px&quot;>${R(s.id,1,px<32?{tiny:true}:{})}</div></div>`).join('')}</div>`).join(''); }

  // demo
  const FLOW = [
    {id:'listening', t:'正在听你说…', d:1800},
    {id:'thinking', t:'我先想一下问题可能出在哪。', d:2200},
    {id:'planning', t:'拆成 3 步来做：', d:2600, steps:['复现报错','定位原因','修复并验证']},
    {id:'searching', t:'正在读取 auth/ 目录下的 12 个文件…', d:2600, on:0},
    {id:'debugging', t:'找到了：token 为空时调用了 .split()。', d:2600, on:1, pill:'定位问题 · TypeError'},
    {id:'coding', t:'正在修改 src/auth/login.ts', d:2800, on:2, pill:'编辑 src/auth/login.ts'},
    {id:'running', t:'跑一遍登录相关的测试。', d:2600, on:2},
    {id:'awaiting', t:'改动涉及 2 个文件，确认后我就提交。', d:3000, on:2},
    {id:'done', t:'修好了，测试全部通过 ✓', d:3200, on:3, pill:'已完成 · 修改 2 个文件'},
    {id:'idle', t:'还有什么需要我做的？', d:2400, on:3}
  ];
  let steps = [], timer = null, i = 0;
  const tl = document.getElementById('tl');
  tl.innerHTML = FLOW.map(f => `<li>${byId(f.id).name}</li>`).join('');
  function show(f, idx){
    curDemo = {f, i: idx};
    document.getElementById('demoPill').innerHTML = pill(f.id, f.pill);
    document.getElementById('demoAv').innerHTML = R(f.id,1);
    document.getElementById('demoBig').innerHTML = R(f.id);
    document.getElementById('demoText').textContent = f.t || byId(f.id).pill;
    if (f.steps) steps = f.steps;
    document.getElementById('demoSteps').innerHTML = steps.map((s,k) => `<li class=&quot;${f.on!=null &amp;&amp; k<=f.on ? 'on':''}&quot; style=&quot;${f.on!=null &amp;&amp; k<=f.on ? 'color:'+colorOf(f.id):''}&quot;><span style=&quot;color:var(--ink)&quot;>${s}</span></li>`).join('');
    [...tl.children].forEach((li,k) => li.classList.toggle('cur', k===idx));
    [...document.querySelectorAll('#pick button')].forEach(b => b.classList.toggle('sel', b.dataset.id===f.id));
  }
  function step(){ show(FLOW[i], i); const d = FLOW[i].d; i = (i+1) % FLOW.length; if (i===0) steps=[]; timer = setTimeout(step, d); }
  document.getElementById('play').onclick = () => { clearTimeout(timer); i = 0; steps = []; step(); };
  document.getElementById('stop').onclick = () => clearTimeout(timer);
  document.getElementById('pick').innerHTML = STATES.map(s => `<button data-id=&quot;${s.id}&quot;>${s.name}</button>`).join('');
  document.getElementById('pick').onclick = e => { const id = e.target.dataset &amp;&amp; e.target.dataset.id; if(!id) return; clearTimeout(timer); [...tl.children].forEach(li=>li.classList.remove('cur')); steps=[]; show({id}, -1); };
  drawAll(); clearTimeout(timer); i = 0; steps = []; step();
})();
