[package]
name = "openbitfun-link-gateway"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun browser gateway: email sign-in, the account's devices, and a byte pipe into the account's Link network"

[[bin]]
name = "openbitfun-link-gateway"
path = "src/main.rs"

[dependencies]
# Joins account networks as a gateway member and opens streams to devices.
openbitfun-link = { path = "../../../crates/services/link" }
# Gateway membership minted from the issuer key (network derivation, join tokens).
openbitfun-relay-service = { path = "../../../crates/services/relay-service" }
# The ring TLS provider for the HTTPS clients (identity authority).
openbitfun-services-core = { path = "../../../crates/services/services-core", features = ["tls-provider"] }
# The fleet policy shared with every client (`rank_entry_candidates`).
openbitfun-product-domains = { path = "../../../crates/contracts/product-domains" }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
log = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
