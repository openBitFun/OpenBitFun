# Include inside the existing relay site server block (after the
# relay includes). The OpenBitFun server opens no port of its own: it is
# reached only through its domain over HTTPS, which the hosting provider's
# front end forwards to nginx on :80. This include is the only way in to the mesh relay node
# (WebSocket listener on 127.0.0.1:11011) and the credential issuer
# (127.0.0.1:19720); neither listens on a public address.
# Requires conf.d/relay-v1.0.2.conf (trusted front-end peers, connection-upgrade map,
# log format, limit zones).

# EasyTier WebSocket transport: wss://<relay-host>/mesh/et/
location ^~ /mesh/et/ {
    # Every request comes from a provider front-end node: take the client
    # address from X-Forwarded-For (only from those ranges) so the per-client
    # connection limit counts devices, not front-end nodes.
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_conn relay_v102_client_connections 64;
    limit_conn_status 429;

    proxy_pass http://127.0.0.1:11011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $relay_v102_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    # A tunnel is a byte stream: no buffering in either direction.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    # The front end closes a WebSocket after 180 s without traffic (measured);
    # EasyTier pings every peer connection at least every 32 s, so a live
    # tunnel never idles out. nginx itself never cuts a tunnel first.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}

# Per-account mesh credentials (openbitfun-mesh-issuer on loopback).
location = /mesh/v1/credentials {
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_req zone=relay_v102_client_requests burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;

    proxy_pass http://127.0.0.1:19720;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}
location = /mesh/v1/info {
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_req zone=relay_v102_client_requests burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:19720;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}

# Browser gateway (openbitfun-link-gateway on loopback): the web controller's
# API (`/obp/api/v1/*`: email sign-in, the account's devices) and the device
# pipe `wss://<relay-host>/obp/<deviceId>` (a byte stream; the browser and the
# device run OBP's end-to-end channel inside it).
location ^~ /obp/ {
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_conn relay_v102_client_connections 64;
    limit_conn_status 429;
    limit_req zone=relay_v102_client_requests burst=50 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:19730;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $relay_v102_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    # The gateway pings every pipe each 30 s (the front end closes a silent
    # WebSocket after 180 s); nginx never cuts a pipe first.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}

# The web controller (NSH web bundle, `pnpm run web-controller:build`):
# https://<relay-host>/app/
location = /app {
    return 301 /app/;
}
location ^~ /app/ {
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    # /app/<file> is /opt/openbitfun-web/app/<file>.
    root /opt/openbitfun-web;
    index index.html;
    gzip_static on;
    # Content-hashed files never change; the page itself is revalidated.
    location ~* "\.[0-9a-f]{10}\.(js|wasm|css|bin)$" {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}
