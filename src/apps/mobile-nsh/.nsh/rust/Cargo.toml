# Generated by nsh for the app's Rust crate (nsh.json "rust"): do not edit.
[workspace]
resolver = "3"
members = ["hack", "describe", "test", "ios-host", "ios-app", "macos-host", "macos-app", "linux-host", "linux-app", "windows-host", "windows-app", "android", "web"]
# GPUI's and the terminal's hosts are workspaces of their own, written when
# they are built (`RustApp::gpui_workspace`, `RustApp::tui_workspace`): other
# builds never resolve their crates.
exclude = ["gpui", "tui"]

# The web runtime, as nsh builds its own (nsh's `Cargo.toml`): for size.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The development web runtime (`nsh run --target web`): built again on
# every change to the app's Rust code, so incremental and without LTO; the
# app's crates at -O1, the others for size.
[profile.web-dev]
inherits = "dev"
opt-level = 1
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
[profile.web-dev.package."*"]
opt-level = "s"
[profile.web-dev.package."openbitfun-mobile-native"]
opt-level = 1

[profile.dev.package.quickjs-jit-sys]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.objc2]
opt-level = 3

[profile.dev.package.objc2-encode]
opt-level = 3
