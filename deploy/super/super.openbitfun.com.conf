# Install as /etc/nginx/sites-available/super.openbitfun.com.conf and link it
# from sites-enabled. Needs conf.d/openbitfun-super.conf (nginx-http.conf).
#
# OpenBitFun 2.0's service host. The server opens no port of its own: the
# provider's front end (wildcard *.openbitfun.com certificate) forwards HTTPS
# to nginx on :80, and every service below listens on loopback only:
#
#   /                 web UI launcher            /opt/openbitfun-web/super
#   /b/<bundleId>/    a device's UI (Service Worker; nginx answers the boot page)
#   /cas/<sha256>     web UI pool                openbitfun-link-gateway 127.0.0.1:19730
#   /obp/             browser gateway API + pipes openbitfun-link-gateway 127.0.0.1:19730
#   /mesh/et/         Link relay node (WebSocket) openbitfun-link-node    127.0.0.1:11011
#   /mesh/v1/*        mesh credential issuer      openbitfun-mesh-issuer  127.0.0.1:19720
#   /agent/           cloud agent                 openbitfun-superagent   127.0.0.1:19740
#   /directory/       account device directory    openbitfun-directory    127.0.0.1:19750
#
# The front end closes a WebSocket after 180 s of silence: Link pings every
# tunnel at least every 15 s, the gateway and the cloud agent ping every 30 s,
# so nginx keeps tunnels for 3600 s and never cuts one first.
server {
    listen 80;
    listen [::]:80;
    server_name super.openbitfun.com;

    server_tokens off;
    set_real_ip_from 190.92.193.0/24;
    set_real_ip_from 159.138.94.0/24;
    set_real_ip_from 101.44.169.0/24;
    set_real_ip_from 2405:f080:110::/120;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($obf_super_trusted_peer = 0) { return 403; }

    # Its own directory and retention (logrotate-openbitfun-super.conf, 14
    # days), outside the host's 60-day /var/log/nginx/*.log policy. Request
    # errors would log the client address and full request line, so only
    # critical ones are kept; upstream failures are in the services' journals.
    access_log /var/log/nginx/openbitfun-super/access.log obf_super_json;
    error_log /var/log/nginx/openbitfun-super/error.log crit;

    # ── Device network ───────────────────────────────────────────────────

    location ^~ /mesh/et/ {
        limit_conn obf_super_client_connections 64;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:11011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obf_super_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /mesh/v1/credentials {
        limit_req zone=obf_super_client_requests burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:19720;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location = /mesh/v1/info {
        limit_req zone=obf_super_client_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:19720;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location ^~ /mesh/ { return 404; }

    # ── Account device directory (a relay-service instance of 2.0) ───────

    # Server-only routes never pass the edge (the route also refuses any
    # proxied request).
    location ^~ /directory/api/internal/ { return 404; }
    location = /directory { return 308 /directory/; }
    location ^~ /directory/ {
        limit_conn obf_super_client_connections 128;
        limit_conn_status 429;
        limit_req zone=obf_super_client_requests burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:19750/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obf_super_connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 140s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # ── Cloud agent ──────────────────────────────────────────────────────

    location = /agent/health {
        limit_req zone=obf_super_client_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:19740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /agent/ {
        limit_req zone=obf_super_client_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn obf_super_client_connections 32;
        limit_conn_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:19740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obf_super_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # ── Browser gateway ──────────────────────────────────────────────────

    location ^~ /obp/ {
        limit_conn obf_super_client_connections 64;
        limit_conn_status 429;
        limit_req zone=obf_super_client_requests burst=50 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:19730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obf_super_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The web UI pool: files of the UI bundles devices ship, by hash.
    location ^~ /cas/ {
        limit_conn obf_super_client_connections 64;
        limit_conn_status 429;
        limit_req zone=obf_super_client_requests burst=200 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        gzip off;
        proxy_pass http://127.0.0.1:19730;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
    }

    # ── Web UI ───────────────────────────────────────────────────────────

    # A device's bundle runs at /b/<bundleId>/ from the Service Worker
    # (/ui-loader.js). A request that reaches nginx gets the boot page, which
    # registers the worker and reloads; nginx never serves bundle files here.
    location ^~ /b/ {
        root /opt/openbitfun-web/super;
        try_files /ui-boot.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }

    # The launcher (`pnpm run web-controller:build`), at the root.
    location / {
        root /opt/openbitfun-web/super;
        index index.html;
        try_files $uri $uri/ =404;
        gzip_static on;
        location ~* "\.[0-9a-f]{10}\.(js|wasm|css|bin)$" {
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data:; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }
}
