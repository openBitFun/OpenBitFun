name: Nightly Artifact Build

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Commit SHA or ref to build."
        required: true
        type: string
      version:
        description: "Prerelease version projected into every artifact producer."
        required: true
        type: string
      artifact_prefix:
        description: "Prefix isolating artifacts in the caller run."
        required: true
        type: string
      artifact_retention_days:
        description: "Retention for build artifacts."
        required: false
        default: 1
        type: number
      build_desktop_packages:
        description: "Whether to run the native Desktop package producers."
        required: false
        default: true
        type: boolean
      desktop_platforms:
        description: "JSON array of native Desktop platform names to package."
        required: false
        default: '["linux-x64","linux-arm64","macos-arm64","macos-x64","windows-x64"]'
        type: string
      build_linux_binaries:
        description: "Whether to build Linux CLI and Relay archives."
        required: false
        default: true
        type: boolean
      build_relay_image:
        description: "Whether to validate the Relay runtime image without publishing it."
        required: false
        default: true
        type: boolean
      upload_artifacts:
        description: "Whether to upload package outputs for a publishing caller."
        required: false
        default: true
        type: boolean
      cache_write:
        description: "Allow a trusted non-PR caller to refresh build caches."
        required: false
        default: false
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBKEY:
        required: false

permissions:
  contents: read

jobs:
  # ── Native desktop packages ────────────────────────────────────────
  package:
    name: Package (${{ matrix.platform }})
    if: ${{ inputs.build_desktop_packages }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm","macos-arm64":"macos-15","macos-x64":"macos-15-intel","windows-x64":"windows-latest"}')[matrix.platform] }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OPENBITFUN_RELEASE_CHANNEL: nightly
      # Nightly does not publish a latest-v1.json feed yet. Preserve its
      # existing stable updater endpoints until that publishing path exists.
      TAURI_UPDATER_ENDPOINT: https://github.com/openBitFun/OpenBitFun/releases/latest/download/latest-v1.json
      TAURI_UPDATER_FALLBACK_ENDPOINT: https://openbitfun.com/release/latest-v1.json
      # Nightly relay archives are signed too (linux-binaries.yml receives the
      # key), so nightly Desktop needs the same trust root to verify them.
      OPENBITFUN_RELEASE_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      PACKAGE_TARGET: ${{ fromJSON('{"linux-x64":"x86_64-unknown-linux-gnu","linux-arm64":"aarch64-unknown-linux-gnu","macos-arm64":"aarch64-apple-darwin","macos-x64":"x86_64-apple-darwin","windows-x64":"x86_64-pc-windows-msvc"}')[matrix.platform] }}

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.desktop_platforms) }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      # The native runner uses GTK 4 + WebKitGTK 6; the backend and the MiniApp
      # window shell (still a Tauri/WebKitGTK 4.1 executable) need the rest.
      - name: Install Linux system dependencies (native desktop)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libasound2-dev \
            libxdo-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolve Bun executable cache
        id: bun-cache-target
        shell: bash
        run: |
          if [[ -f scripts/ci/bun-cache-target.mjs ]]; then
            node scripts/ci/bun-cache-target.mjs 1.3.14
          else
            echo "::notice::Bun caching is unavailable for this older source revision; setup-bun will install it normally."
          fi

      - name: Restore Bun executable
        id: bun-executable-cache
        if: steps.bun-cache-target.outputs.key != ''
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun-cache-target.outputs.path }}
          key: ${{ steps.bun-cache-target.outputs.key }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Save Bun executable
        if: >-
          inputs.cache_write && github.event_name != 'pull_request' &&
          github.event_name != 'pull_request_target' &&
          steps.bun-cache-target.outputs.key != '' &&
          steps.bun-executable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun-cache-target.outputs.path }}
          key: ${{ steps.bun-cache-target.outputs.key }}

      # NSH (the UI bundle's native module and the runner) needs a newer rustc
      # than the workspace; the packaging scripts select it with RUSTUP_TOOLCHAIN.
      - name: Setup NSH Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ env.PACKAGE_TARGET }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PACKAGE_TARGET }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "nightly-native-v1-${{ github.base_ref || github.ref_name }}-${{ matrix.platform }}"
          cache-bin: false
          # A PR merge ref can never become a reusable base cache. Even a
          # trusted caller cannot override this guard.
          save-if: ${{ inputs.cache_write && github.event_name != 'pull_request' }}
          cache-on-failure: ${{ inputs.cache_write && github.event_name != 'pull_request' }}

      - name: Verify committed Cargo metadata
        run: cargo metadata --locked --no-deps

      - name: Install NSH CLI
        run: node scripts/ci/install-nsh.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Windows Installer is no longer packaged here (it wraps the retired
      # Tauri desktop executable), but its i18n projection and Tauri packages
      # stay verified until it is moved to the native app.
      - name: Verify Installer i18n projection
        if: runner.os == 'Windows'
        run: pnpm --dir OpenBitFun-Installer run sync:i18n

      - name: Verify Installer Tauri package alignment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          info="$(pnpm --dir OpenBitFun-Installer exec tauri info 2>&1)"
          printf '%s\n' "$info"
          if grep -Fq 'Error: Found version mismatched Tauri packages.' <<<"$info"; then
            exit 1
          fi

      - name: Build plugin Host resources
        run: |
          bun install --cwd src/apps/extension-host --frozen-lockfile
          bun run --cwd src/apps/extension-host build

      - name: Patch nightly version
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "Patching version to $NIGHTLY_VERSION"
          ASSET_VERSION="${NIGHTLY_VERSION%%+*}"
          node scripts/set-build-version.mjs --version "$ASSET_VERSION"

          echo "package.json version: $(jq -r '.version' package.json)"
          echo "Cargo.toml version:   $(grep 'x-release-please-version' Cargo.toml)"

      - name: Verify projected Cargo metadata
        run: cargo metadata --locked --no-deps

      - name: Resolve release channel build environment
        run: node scripts/ci/desktop-release-env.mjs

      - name: Build desktop app
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux-x64)
              pnpm run desktop:package:linux -- --target x86_64-unknown-linux-gnu
              ;;
            linux-arm64)
              CARGO_PROFILE_RELEASE_LTO=thin pnpm run desktop:package:linux -- --target aarch64-unknown-linux-gnu
              ;;
            macos-arm64 | macos-x64)
              pnpm run desktop:package:mac
              ;;
            windows-x64)
              pnpm run desktop:package:windows -- --target x86_64-pc-windows-msvc
              ;;
            *)
              echo "Unsupported package platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

      # Nightly macOS packages are not Developer ID signed; this lays out the
      # DMG and the (unsigned) updater archive the release pipeline produces.
      - name: Archive macOS release outputs
        if: runner.os == 'macOS'
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: bash scripts/ci/package-native-macos-release.sh "$PACKAGE_TARGET" "${NIGHTLY_VERSION%%+*}"

      # Launches the packaged app on a scratch profile and drives its loopback
      # OBP owner connection (version, config, workspaces, sessions, a shell
      # round trip), then quits it and requires a clean exit.
      - name: Smoke-test the native app
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node tests/e2e/native/smoke.mjs --app "target/${PACKAGE_TARGET}/release/bundle/macos/OpenBitFun.app"

      - name: Build the CLI's web UI
        # Browsers load the web UI from the device they control, so the CLI
        # embeds the one built from this commit (src/apps/cli/build.rs).
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/ci/build-cli-web-ui.mjs

      - name: Package macOS CLI for SSH dispatch
        if: runner.os == 'macOS'
        id: macos-cli
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ inputs.version }}
          TARGET: ${{ env.PACKAGE_TARGET }}
        run: |
          set -euo pipefail
          ASSET_VERSION="${NIGHTLY_VERSION%%+*}"
          cargo build --release --target "$TARGET" -p openbitfun-cli
          bash scripts/cli/package-unix.sh "$ASSET_VERSION" "$TARGET"

      - name: Sign macOS CLI archive and checksum
        if: runner.os == 'macOS'
        shell: bash
        env:
          OPENBITFUN_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENBITFUN_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENBITFUN_SIGNING_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          bash scripts/sign-release-assets.sh \
            "${{ steps.macos-cli.outputs.archive }}" \
            "${{ steps.macos-cli.outputs.checksum }}"

      # Keep output validation independent from artifact upload. PR callers do
      # not upload packages, but still need evidence that every selected
      # producer emitted the files its publishing caller will collect.
      - name: Verify package outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          require_one() {
            local description="$1"; shift
            if [[ "$#" -ne 1 || ! -s "$1" ]]; then
              echo "Missing non-empty ${description} for ${{ matrix.platform }}" >&2
              return 1
            fi
          }

          case "${{ matrix.platform }}" in
            linux-*)
              require_one 'native Linux package' target/desktop-nsh/OpenBitFun-nsh_*-linux.tar.gz
              ;;
            macos-*)
              bundle="target/${PACKAGE_TARGET}/release/bundle"
              test -x "$bundle/macos/OpenBitFun.app/Contents/MacOS/OpenBitFun"
              require_one 'macOS DMG' "$bundle"/dmg/*.dmg
              require_one 'macOS updater archive' "$bundle"/macos/OpenBitFun-nsh_*.app.tar.gz
              cli_archives=(openbitfun-cli-*-"${PACKAGE_TARGET}".tar.gz)
              [[ ${#cli_archives[@]} -eq 1 ]]
              test -s "${cli_archives[0]}"
              test -s "${cli_archives[0]}.sha256"
              ;;
            windows-x64)
              require_one 'native Windows package' target/desktop-nsh/OpenBitFun-nsh_*-windows.zip
              ;;
            *)
              echo "Unsupported package platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

      - name: Upload bundles
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: openbitfun-${{ inputs.artifact_prefix }}-${{ matrix.platform }}-bundle
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
          path: |
            target/*/release/bundle/dmg
            target/*/release/bundle/macos/OpenBitFun-nsh_*.app.tar.gz
            target/*/release/bundle/macos/OpenBitFun-nsh_*.app.tar.gz.sig
            target/desktop-nsh/OpenBitFun-nsh_*-windows.zip
            target/desktop-nsh/OpenBitFun-nsh_*-linux.tar.gz
            openbitfun-cli-*-apple-darwin.tar.gz
            openbitfun-cli-*-apple-darwin.tar.gz.sha256
            openbitfun-cli-*-apple-darwin.tar.gz.sig
            openbitfun-cli-*-apple-darwin.tar.gz.sha256.sig

  linux-binaries:
    name: Linux CLI and Relay Server
    if: ${{ inputs.build_linux_binaries || inputs.build_relay_image }}
    uses: ./.github/workflows/linux-binaries.yml
    secrets:
      release_signing_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      release_signing_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      release_pubkey: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      version: ${{ inputs.version }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
      upload_artifacts: ${{ inputs.upload_artifacts }}
      cache_write: ${{ inputs.cache_write }}
      validate_relay_image: ${{ inputs.build_relay_image }}
