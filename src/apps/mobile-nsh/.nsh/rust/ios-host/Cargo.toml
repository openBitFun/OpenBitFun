[package]
name = "nsh-app-openbitfun-mobile-native-ios-host"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-openbitfun-mobile-native-ios-host"
path = "main.rs"

[dependencies]
nsh-ios-host = { version = "=0.7.1" }
