[package]
name = "openbitfun-obp"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun backend protocol (OBP): JSON-RPC over WebSocket, the event ring, the account-device listener and the controller client"

[lib]
name = "openbitfun_obp"
path = "src/lib.rs"

# One copy of the OBP wire for every host and controller: the desktop backend
# and the CLI host serve it (`server`), the desktop and the phone app dial it
# (`client`). Hosts plug in their dispatcher and event source through
# `server::ObpBackend`; the wire format is the contract.
[features]
default = []
# The controller side: TLS to a device's self-signed certificate, the
# account-device handshake, `hello`/`call`/`ack` and the event stream.
client = [
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:openbitfun-services-core",
]
# The host side: loopback and Link listeners, scopes, pairing records, the
# end-to-end channel for browsers behind the server gateway.
server = [
    "client",
    "dep:axum",
    "dep:rcgen",
    "dep:base64",
    "dep:rand",
    "dep:aes-gcm",
    "dep:hkdf",
    "dep:x25519-dalek",
    "dep:uuid",
    "dep:mime_guess",
    "dep:urlencoding",
    "dep:openbitfun-product-domains",
]
# The fleet layer: every runtime host of the account in one surface. The
# owner-partition index, digest replication and anti-entropy, legacy-peer
# polling, `fleet_call` routing and the per-origin event mux. Hosts plug in
# through `fleet::router::FleetBackend` and `fleet::sync::FleetPeerTransport`.
# It also dials the account's cloud node (`client::cloud`) over
# `wss://<domain>/agent/obp`, verified against the bundled web PKI roots.
fleet = ["server", "dep:openbitfun-product-domains", "dep:webpki-roots"]
# Loopback stand-ins for the device network, for host test suites.
test-support = []

[dependencies]
# Handshake proofs, the OBP port range and the mesh capability name.
openbitfun-link = { path = "../../services/link" }
openbitfun-services-core = { path = "../../services/services-core", features = ["tls-provider"], optional = true }
openbitfun-product-domains = { path = "../../contracts/product-domains", optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { workspace = true, features = ["tls12"], optional = true }
tokio-tungstenite = { workspace = true, features = ["handshake"], optional = true }
axum = { workspace = true, features = ["ws"], optional = true }
rcgen = { workspace = true, features = ["crypto", "ring"], optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# The NSH web bundle served at `/`.
mime_guess = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
# The cloud node's public certificate (`fleet`).
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# Listener tests: a real WebSocket client (plain and TLS).
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-native-roots"] }

[lints]
workspace = true
