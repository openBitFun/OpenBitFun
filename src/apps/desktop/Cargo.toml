[package]
name = "openbitfun-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun desktop backend library (loaded in-process by the native NSH app)"

[lib]
name = "openbitfun_desktop_lib"
# `cdylib`: the native NSH runner loads it through the C ABI in
# `backend_protocol/ffi.rs`; `rlib`: tests and in-workspace consumers.
crate-type = ["cdylib", "rlib"]

[dependencies]
openbitfun-computer-use = { path = "../../crates/services/computer-use" }
openbitfun-miniapp-ipc = { path = "../../crates/adapters/miniapp-ipc" }
openbitfun-services-core = { path = "../../crates/services/services-core", features = ["pet-packages", "local-storage", "installed-apps"] }
# Internal crates
openbitfun-core = { path = "../../crates/assembly/core", features = ["product-full"] }
# OpenBitFun Link: the device network, in-process (EasyTier fork), its
# status and the account-device handshake proofs.
openbitfun-link = { path = "../../crates/services/link" }
# The backend protocol (OBP): listeners, scopes, the Link handshake and the
# controller client, shared with the CLI host and the phone app.
openbitfun-obp = { path = "../../crates/adapters/obp", features = ["server"] }
openbitfun-agent-runtime = { path = "../../crates/execution/agent-runtime", features = ["agent-runtime"] }
openbitfun-runtime-ports = { path = "../../crates/contracts/runtime-ports", features = ["agent-api", "permission", "workspace-ports"] }
openbitfun-product-domains = { path = "../../crates/contracts/product-domains" }
openbitfun-services-integrations = { path = "../../crates/services/services-integrations", features = ["miniapp-market", "skillhub", "remote-ssh-concrete", "speech-realtime"] }
openbitfun-core-types = { path = "../../crates/contracts/core-types" }
openbitfun-agent-tools = { path = "../../crates/execution/tool-contracts", features = ["element-token", "computer-use-contract"] }
openbitfun-transport = { path = "../../crates/adapters/transport" }
openbitfun-events = { path = "../../crates/contracts/events" }
openbitfun-webdriver = { path = "../../crates/adapters/webdriver" }
openbitfun-acp = { path = "../../crates/interfaces/acp", default-features = false, features = ["client"] }

keepawake = { workspace = true }

# Inherited from workspace
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# Runtime logger (per-target levels, session log files).
fern = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
dark-light = { workspace = true }
similar = { workspace = true }
ignore = { workspace = true }
mime_guess = { workspace = true }
urlencoding = { workspace = true }
reqwest = { workspace = true, features = ["http2", "json", "query", "rustls-no-provider", "stream"] }
semver = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
bzip2 = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
rand = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
minisign-verify = { workspace = true }
# Controller-local drag thumbnails decode these formats; other files use UI icons.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "webp"] }
resvg = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Remote Connect route tests run the real Relay router as a loopback fixture.
openbitfun-relay-service = { path = "../../crates/services/relay-service" }
# OBP over the mesh: loopback stand-ins for Link in the desktop's mesh tests.
openbitfun-obp = { path = "../../crates/adapters/obp", features = ["server", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The `computer_use_native_roundtrip` harness opens a disposable AppKit window.
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
dispatch = { workspace = true }

[target.'cfg(windows)'.dependencies]
# MiniApp desktop shortcuts and Start menu entries (Shell links, AppUserModelID).
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = []
# Debug-only helpers for release-like builds (computer-use test support).
# Never enabled in release builds intended for end users.
devtools = ["openbitfun-computer-use/test-support"]

[target.'cfg(target_os = "linux")'.dependencies]
# Keep Linux desktop packages independent of the build distribution's bzip2 SONAME.
bzip2 = { workspace = true, features = ["static"] }
libc = { workspace = true }

[lints]
workspace = true

[[test]]
name = "computer_use_native_roundtrip"
path = "tests/computer_use_native_roundtrip.rs"
harness = false
required-features = ["devtools"]
