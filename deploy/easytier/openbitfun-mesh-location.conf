# Include inside the existing relay site server block (after the
# relay includes). Exposes the OpenBitFun mesh node's WebSocket listener and the
# mesh credential issuer through the cloud WAF on :80, for networks whose cloud
# security group does not open the EasyTier ports (11010/tcp+udp, 11011/tcp).
# Requires conf.d/relay-v1.0.2.conf (trusted WAF peers, connection-upgrade map).

# EasyTier WebSocket transport: wss://<relay-host>/mesh/et/
location ^~ /mesh/et/ {
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_conn relay_v102_client_connections 64;
    limit_conn_status 429;

    proxy_pass http://127.0.0.1:11011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $relay_v102_connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    # EasyTier sends its own heartbeats; keep idle tunnels open.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}

# Per-account mesh credentials (openbitfun-mesh-issuer on loopback).
location = /mesh/v1/credentials {
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_req zone=relay_v102_client_requests burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;

    proxy_pass http://127.0.0.1:19720;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}
location = /mesh/v1/info {
    if ($relay_v102_trusted_origin_peer = 0) { return 403; }
    limit_req zone=relay_v102_client_requests burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:19720;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    access_log /var/log/nginx/openbitfun-mesh-access.log relay_v102_json;
}
