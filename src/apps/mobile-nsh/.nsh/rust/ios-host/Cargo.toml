nsh-base = { version = "=0.7.1", features = ["highlight"] }
app_openbitfun_mobile_native = { package = "openbitfun-mobile-native", path = "/Users/liwenbo/ide_dev/repo/OpenBitFun/src/apps/mobile-nsh/native" }
workspace-hack = { package = "nsh-app-openbitfun-mobile-native-hack", path = "../hack" }
[target.'cfg(target_os = "ios")'.dependencies]
