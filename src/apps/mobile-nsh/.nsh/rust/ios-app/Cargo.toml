[package]
name = "nsh-app-openbitfun-mobile-native-ios-app"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "nsh-app-openbitfun-mobile-native-ios-app"
path = "main.rs"

[dependencies]
nsh-ios-app = { version = "=0.6.1", default-features = false }
nsh-core = { version = "=0.6.1" }
nsh-base = { version = "=0.6.1", default-features = false }
app_openbitfun_mobile_native = { package = "openbitfun-mobile-native", path = "/Users/liwenbo/ide_dev/repo/OpenBitFun/src/apps/mobile-nsh/native" }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "=0.6.1", default-features = false }

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg"]
js = ["nsh-ios-app/js"]
shader = ["nsh-ios-app/shader"]
editor = ["nsh-ios-app/editor"]
emoji-picker = ["nsh-ios-app/emoji-picker"]
highlight = ["nsh-ios-app/highlight"]
math = ["nsh-ios-app/math"]
plot = ["nsh-ios-app/plot"]
rich-editor = ["nsh-ios-app/rich-editor"]
term = ["nsh-ios-app/term"]
zlib = ["nsh-ios-app/zlib"]
crypto = ["nsh-ios-app/crypto"]
websocket = ["nsh-ios-app/websocket"]
updater = ["nsh-ios-app/updater"]
svg = ["nsh-ios-app/svg"]
