# Install as /etc/nginx/conf.d/openbitfun-super.conf (http context).
# OpenBitFun 2.0's own definitions for super.openbitfun.com. Nothing here is
# shared with the 1.0 relay site (remote.openbitfun.com) or its conf.d file.

map $http_upgrade $obf_super_connection_upgrade {
    default upgrade;
    '' close;
}

# The hosting provider's front-end ranges (refresh them when the provider
# changes its origin source ranges). Only these, and loopback, may reach the
# site; the client address comes from X-Forwarded-For set by them.
geo $realip_remote_addr $obf_super_trusted_peer {
    default 0;
    127.0.0.1 1;
    ::1 1;
    190.92.193.0/24 1;
    159.138.94.0/24 1;
    101.44.169.0/24 1;
    2405:f080:110::/120 1;
}

limit_conn_zone $binary_remote_addr zone=obf_super_client_connections:10m;
limit_req_zone $binary_remote_addr zone=obf_super_client_requests:10m rate=100r/s;

log_format obf_super_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"requestTime":$request_time}';
