[package]
name = "openbitfun-link"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun Link: the embedded device network (EasyTier fork) joined by account sign-in"

[lib]
name = "openbitfun_link"
path = "src/lib.rs"

[dependencies]
# The EasyTier fork (LGPL-3.0, source in this repository; see
# third_party/easytier/OPENBITFUN-PATCH.md).
easytier = { path = "../../../../third_party/easytier/easytier", default-features = false, features = ["websocket", "ffi-dataplane", "tcp-hole-punch", "upnp", "ring-crypto", "dhcp-ipv4"] }
easytier-core = { path = "../../../../third_party/easytier/easytier-core", default-features = false, features = ["proxy-smoltcp-stack"] }
toml = { workspace = true }
network-interface = "2.0.5"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The account issuer client (hosts sign in; Link fetches its credentials).
openbitfun-services-core = { path = "../services-core", features = ["tls-provider"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
# Bundled issuer roots for hosts without a usable platform verifier
# (Android without its Java-side setup).
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
